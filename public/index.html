const WEEKDAYS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const MONTHS = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
function pad2(n) { return String(n).padStart(2, "0"); }
function isoDate(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function parseISO(s) { const [y, m, dd] = s.split("-").map(Number); return new Date(y, m - 1, dd); }
function fmtShort(iso) { const d = parseISO(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function dayIndexFromISO(iso, startDate) { return Math.round((parseISO(iso) - startDate) / 86400000); }
function nightsBetween(ci, co) { return Math.round((parseISO(co) - parseISO(ci)) / 86400000); }
function fmtWhen(ts) { const d = new Date(ts); return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

function monthlyRevenue(reservationsData, todayDate) {
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(todayDate.getFullYear(), todayDate.getMonth() - i, 1);
    months.push({ key: `${d.getFullYear()}-${d.getMonth()}`, mes: MONTHS[d.getMonth()], receita: 0 });
  }
  reservationsData.forEach((r) => {
    if (r.status === "cancelled" || r.status === "no-show") return;
    const ci = parseISO(r.checkin);
    const key = `${ci.getFullYear()}-${ci.getMonth()}`;
    const m = months.find((x) => x.key === key);
    if (m) m.receita += r.value || 0;
  });
  return months;
}

    @media print{ body{margin:0;} }
  </style></head><body>
    <h1>Slow Living — Alentejo, Portugal</h1>
    <p class="sub">Fatura · Reserva ${reservation.numero}${reservation.invoiceClosed ? " · FECHADA" : ""}</p>
    <table><tbody>

    <table>

        <tr><td>IVA (${ivaPct}%)</td><td class="right">€${ivaAmount.toFixed(2)}</td></tr>
        ${touristTaxRow}
        <tr class="total-row"><td>Total</td><td class="right">€${total.toFixed(2)}</td></tr>
        <tr><td>Pago</td><td class="right">€${pago.toFixed(2)}</td></tr>
        <tr><td>Saldo</td><td class="right">€${saldo.toFixed(2)}</td></tr>

  </body></html>`;
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `fatura-${reservation.numero}.html`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);

}

/* ---------------------------------------------------------------------- */
/* Timeline                                                               */
/* ---------------------------------------------------------------------- */

const CELL_W = 40, ROW_H = 56, GROUP_H = 30, HEADER_H = 40, LABEL_W = 108;

function LegendDot({ color, label }) {
  return <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: color }} />{label}</span>;
}

function Timeline({ unitsData, reservationsData, guestsData, tasksData, todayDate, todayStr, onOpenReservation, onOpenUnit, onCreateAt }) {
  const scrollRef = useRef(null);
  const [rangeStart, setRangeStart] = useState(() => addDays(todayDate, -14));
  const [rangeDays, setRangeDays] = useState(60);
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const prevRangeStartRef = useRef(rangeStart);
  const extendingRef = useRef(false);
  const todayIdx = Math.round((todayDate - rangeStart) / 86400000);
  const dates = Array.from({ length: rangeDays }, (_, i) => addDays(rangeStart, i));
  const isWeekend = (d) => d.getDay() === 0 || d.getDay() === 6;

  useLayoutEffect(() => {
    const diffDays = Math.round((prevRangeStartRef.current - rangeStart) / 86400000);
    if (diffDays > 0 && scrollRef.current) scrollRef.current.scrollLeft += diffDays * CELL_W;
    prevRangeStartRef.current = rangeStart;
  }, [rangeStart]);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollLeft = Math.max(0, todayIdx * CELL_W); }, []);

  function handleScroll(e) {
    if (extendingRef.current) return;
    const el = e.currentTarget;
    const buffer = Math.max(CELL_W * 6, el.clientWidth * 0.6);
    if (el.scrollLeft < buffer) {
      extendingRef.current = true;
      setRangeStart((p) => addDays(p, -30)); setRangeDays((p) => p + 30);
      setTimeout(() => { extendingRef.current = false; }, 250);
    } else if (el.scrollLeft > el.scrollWidth - el.clientWidth - buffer) {
      extendingRef.current = true;
      setRangeDays((p) => p + 30);
      setTimeout(() => { extendingRef.current = false; }, 250);
    }
  }
  function jumpToToday() { if (scrollRef.current) scrollRef.current.scrollLeft = Math.max(0, todayIdx * CELL_W); }

  const q = search.trim().toLowerCase();
  const matchesUnit = (u) => {
    if (statusFilter !== "all" && unitStatus(u, reservationsData, tasksData, todayStr).label !== statusFilter) return false;
    if (!q) return true;
    if (u.name.toLowerCase().includes(q)) return true;
    return reservationsData.some((r) => r.unitId === u.id && r.status !== "cancelled" && reservationGuestSummary(r, guestsData).toLowerCase().includes(q));
  };
  const filteredUnits = unitsData.filter(matchesUnit);

  const groups = {};
  const groupOrder = [];
  filteredUnits.forEach((u) => { if (!groups[u.place]) { groups[u.place] = []; groupOrder.push(u.place); } groups[u.place].push(u); });
  const rowItems = [];
  groupOrder.forEach((place) => { rowItems.push({ type: "group", label: place }); groups[place].forEach((u) => rowItems.push({ type: "unit", unit: u })); });
  const STATUS_FILTERS = ["all", "Livre", "Ocupado", "Em limpeza", "Aguarda limpeza", "Arrendado"];
  const totalWidth = LABEL_W + rangeDays * CELL_W;

  return (
    <div>
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div className="flex items-center gap-4 flex-wrap text-xs" style={{ color: C.inkSoft }}>
          <LegendDot color={C.stone} label="Confirmada" /><LegendDot color={C.terracotta} label="Check-in feito" />
          <LegendDot color={C.olive} label="Check-out feito" /><LegendDot color={C.inkSoft} label="Arrendamento" />
        </div>
        <button onClick={jumpToToday} className="text-xs font-medium px-3 py-1.5 rounded-full border" style={{ borderColor: C.line, color: C.inkSoft }}>Hoje</button>
      </div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Pesquisar unidade ou hóspede…" className="px-3 py-1.5 rounded-full border text-xs" style={{ ...inputStyle, minWidth: 220 }} />
        <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="px-2.5 py-1.5 rounded-full border text-xs" style={{ ...inputStyle, backgroundColor: "#fff" }}>
          {STATUS_FILTERS.map((s) => <option key={s} value={s}>{s === "all" ? "Todos os estados" : s}</option>)}
        </select>
      </div>
      <p className="text-xs mb-3" style={{ color: C.inkSoft }}>Toque numa reserva para ver detalhes, ou num espaço livre para criar uma nova. Desliza para ver mais datas.</p>
      <div className="rounded-xl border shadow-sm overflow-x-auto" style={{ borderColor: C.line }} ref={scrollRef} onScroll={handleScroll}>
          <div style={{ width: totalWidth, position: "relative" }}>
            <div className="flex" style={{ height: HEADER_H, position: "sticky", top: 0, zIndex: 6 }}>
              <div style={{ width: LABEL_W, position: "sticky", left: 0, zIndex: 7, backgroundColor: C.card, borderColor: C.line, color: C.inkSoft }} className="shrink-0 border-b border-r flex items-center px-3 text-xs font-semibold">Unidade</div>
              <div className="flex" style={{ backgroundColor: C.card }}>
                {dates.map((d, i) => (
                  <div key={i} style={{ width: CELL_W, height: HEADER_H, backgroundColor: isWeekend(d) ? C.stone + "1A" : "transparent", borderColor: C.line }} className="shrink-0 flex flex-col items-center justify-center text-xs border-b">
                    {i === todayIdx ? (
                      <span className="px-1.5 py-0.5 rounded-full text-xs font-semibold" style={{ backgroundColor: C.terracotta, color: "#fff" }}>{d.getDate()}</span>
                    ) : (
                      <>
                        <span style={{ color: C.inkSoft }}>{WEEKDAYS[d.getDay()]}</span>
                        <span style={{ color: C.inkSoft }}>{d.getDate()}</span>
                      </>
                    )}
                  </div>
                ))}
              </div>
            </div>
            {rowItems.map((it, i) => {
              if (it.type === "group") {
                return (
                  <div key={"g" + i} className="flex" style={{ height: GROUP_H }}>
                    <div style={{ width: LABEL_W, position: "sticky", left: 0, zIndex: 5, backgroundColor: C.sidebar, color: C.sidebarText, borderColor: "rgba(0,0,0,0.15)" }} className="shrink-0 flex items-center px-3 text-xs font-semibold tracking-wide border-r">{it.label}</div>
                    <div style={{ flex: 1, backgroundColor: C.sidebar }} />
                  </div>
                );
              }
              const u = it.unit;
              const isLong = u.type !== "Alojamento Local";
              const hk = unitStatus(u, reservationsData, tasksData, todayStr);
              return (
                <div key={u.id} className="flex relative border-b" style={{ height: ROW_H, borderColor: C.line }}>
                  <div style={{ width: LABEL_W, position: "sticky", left: 0, zIndex: 4, backgroundColor: C.card, borderColor: C.line, color: C.ink }} className="shrink-0 border-r flex items-center gap-1.5 px-3 text-xs font-medium cursor-pointer" onClick={() => onOpenUnit(u.id)}>
                    <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ backgroundColor: hk.color }} title={hk.label} />
                    <span className="truncate underline decoration-dotted">{u.name}</span>
                  </div>
                  <div className="absolute inset-0 flex cursor-pointer" style={{ left: LABEL_W }}
                    onClick={isLong ? undefined : (e) => { const rect = e.currentTarget.getBoundingClientRect(); const idx = Math.floor((e.clientX - rect.left) / CELL_W); onCreateAt(u.id, addDays(rangeStart, idx)); }}>
                    {dates.map((d, di) => <div key={di} style={{ width: CELL_W, backgroundColor: isWeekend(d) ? C.stone + "0F" : "transparent", borderColor: C.line + "80" }} className="h-full border-r shrink-0" />)}
                  </div>
                  {isLong ? (
                    <div className="absolute rounded-lg flex items-center px-3 text-xs text-white font-medium shadow-sm" style={{ top: 8, bottom: 8, left: LABEL_W + 8, zIndex: 3, backgroundColor: C.inkSoft }}>Arrendamento — {u.tenant}</div>
                  ) : (
                    reservationsData.filter((r) => r.unitId === u.id && r.status !== "cancelled").map((r) => {
                      const ci = dayIndexFromISO(r.checkin, rangeStart), co = dayIndexFromISO(r.checkout, rangeStart);
                      const clampedCi = Math.max(0, ci), clampedCo = Math.min(rangeDays, co);
                      if (clampedCo <= clampedCi) return null;
                      const left = LABEL_W + clampedCi * CELL_W, width = Math.max(clampedCo - clampedCi, 1) * CELL_W;
                      const barW = Math.max(width - 4, 22);
                      const meta = reservationStatusMeta(r.status);
                      return (
                        <button key={r.id} onClick={(e) => { e.stopPropagation(); onOpenReservation(r); }}
                          className="absolute rounded-lg px-2 flex items-center text-xs font-medium text-white overflow-hidden text-left shadow-sm"
                          style={{ top: 8, bottom: 8, left, width: barW, zIndex: 3, backgroundColor: meta.color }}>
                          <span className="truncate">{barW > 90 ? `${r.numero} · ` : ""}{reservationGuestSummary(r, guestsData)}</span>
                        </button>
                      );
                    })
                  )}
                </div>
              );
            })}
            <div className="absolute pointer-events-none sl-pulse" style={{ top: HEADER_H, left: LABEL_W + todayIdx * CELL_W + CELL_W / 2, width: 2, bottom: 0, backgroundColor: "var(--signal)", opacity: 0.7, boxShadow: "0 0 8px var(--signal-glow)" }} />
          </div>
      </div>
    </div>
  );
}

          <th className="pb-2 font-medium">Check-in</th><th className="pb-2 font-medium">Check-out</th>
          <th className="pb-2 font-medium">Estado</th><th className="pb-2 font-medium">Origem</th>
          <th className="pb-2 font-medium text-right">Saldo</th>

                <td className="py-2" style={{ color: C.inkSoft }}>{fmtShort(r.checkout)}</td>
                <td className="py-2"><Pill color={meta.color}>{meta.label}</Pill></td>
                <td className="py-2" style={{ color: C.inkSoft }}>{r.source}</td>
                <td className="py-2 text-right" style={{ color: saldo > 0.01 ? C.terracotta : C.ink }}>€{saldo.toFixed(2)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </Card>
  );
}

function UnitDrawer({ unit, reservationsData, guestsData, tasksData, maintenanceData, todayStr, onClose, onOpenReservation }) {
  if (!unit) return null;
  const current = currentReservationFor(unit.id, reservationsData, todayStr);
  const upcoming = reservationsData.filter((r) => r.unitId === unit.id && r.status !== "cancelled" && r.checkin > todayStr).sort((a, b) => a.checkin.localeCompare(b.checkin))[0];
  const isLong = unit.type !== "Alojamento Local";
  const hk = unitStatus(unit, reservationsData, tasksData, todayStr);
  const openMaint = (maintenanceData || []).filter((m) => m.unitId === unit.id && m.status !== "Resolvido");
  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center p-4" style={{ backgroundColor: "rgba(20,15,10,0.5)" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="w-full rounded-2xl p-5" style={{ backgroundColor: C.card, maxWidth: 420, maxHeight: "85vh", overflowY: "auto" }}>
        <div className="flex items-center justify-between mb-1">
          <div className="text-base font-semibold" style={{ color: C.ink }}>{unit.name}</div>
          <Pill color={hk.color}>{hk.label}</Pill>
        </div>
        <div className="text-xs mb-4" style={{ color: C.inkSoft }}>{unit.place}{unit.capacity ? ` · até ${unit.capacity} hóspedes` : ""}</div>

        {!isLong && (
          <>
            <div className="text-xs font-semibold mb-2" style={{ color: C.ink }}>Estadia atual</div>
            {current ? (
              <button onClick={() => onOpenReservation(current.id)} className="w-full text-left mb-4">
                <Card className="p-3"><div className="text-sm font-medium" style={{ color: C.ink }}>{reservationGuestSummary(current, guestsData)}</div><div className="text-xs" style={{ color: C.inkSoft }}>{fmtShort(current.checkin)}–{fmtShort(current.checkout)}</div></Card>
              </button>
            ) : <p className="text-xs mb-4" style={{ color: C.inkSoft }}>Sem hóspedes neste momento.</p>}

            <div className="text-xs font-semibold mb-2" style={{ color: C.ink }}>Próxima reserva</div>
            {upcoming ? (
              <button onClick={() => onOpenReservation(upcoming.id)} className="w-full text-left mb-4">
                <Card className="p-3"><div className="text-sm font-medium" style={{ color: C.ink }}>{reservationGuestSummary(upcoming, guestsData)}</div><div className="text-xs" style={{ color: C.inkSoft }}>{fmtShort(upcoming.checkin)}–{fmtShort(upcoming.checkout)}</div></Card>
              </button>
            ) : <p className="text-xs mb-4" style={{ color: C.inkSoft }}>Sem reservas futuras.</p>}
          </>
        )}
        {isLong && <p className="text-xs mb-4" style={{ color: C.inkSoft }}>Arrendamento de longo prazo — inquilino {unit.tenant}.</p>}

        <div className="text-xs font-semibold mb-2" style={{ color: C.ink }}>Manutenção</div>
        {openMaint.length > 0 ? (
          <div className="space-y-1.5 mb-4">
            {openMaint.map((m) => <div key={m.id} className="text-xs flex justify-between items-center"><span style={{ color: C.ink }}>{m.title}</span><Pill color={maintPriorityColor(m.priority)}>{m.priority}</Pill></div>)}
          </div>
        ) : <p className="text-xs mb-4" style={{ color: C.olive }}>Sem ocorrências ativas.</p>}

        <button onClick={onClose} className="w-full py-2 text-xs" style={{ color: C.inkSoft }}>Fechar</button>
      </div>
    </div>
  );
}

            </select>
          </Field>
          <Field label="Nº do documento"><input value={docNumero} onChange={(e) => setDocNumero(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm" style={inputStyle} /></Field>
        </div>
        <div className="grid grid-cols-2 gap-2.5 mb-4">
          <Field label="Nacionalidade"><input value={nacionalidade} onChange={(e) => setNacionalidade(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm" style={inputStyle} /></Field>
          <Field label="Data de nascimento"><input type="date" value={dataNascimento} onChange={(e) => setDataNascimento(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm" style={inputStyle} /></Field>
        </div>
        <button onClick={() => onSave({ ...guest, email, phone, nif, docTipo, docNumero, nacionalidade, dataNascimento })} className="w-full py-2 rounded-full text-xs font-medium text-white mb-4" style={{ backgroundColor: C.oliveDark }}>Guardar dados</button>
        <div className="text-xs font-semibold mb-2" style={{ color: C.ink }}>Histórico de estadias</div>
        <div className="space-y-2 mb-3">
          {history.map((r) => {
            const meta = reservationStatusMeta(r.status);
            return <div key={r.id} className="flex items-center justify-between text-xs pb-2 border-b" style={{ borderColor: C.line }}><div><span className="font-medium" style={{ color: C.ink }}>{r.numero} · {unitName(r.unitId)}</span> <span style={{ color: C.inkSoft }}>· {fmtShort(r.checkin)}–{fmtShort(r.checkout)} · {guestRoleInReservation(r, guest.id)}</span></div><Pill color={meta.color}>{meta.label}</Pill></div>;
          })}
          {history.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem estadias registadas.</p>}
        </div>
        <button onClick={onClose} className="py-2 text-xs w-full" style={{ color: C.inkSoft }}>Fechar</button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Reservation modal (view / edit / create) with billing + numero+creds   */
/* ---------------------------------------------------------------------- */

function ReservationModal({ mode, reservation, unitId, date, unitsData, reservationsData, guestsData, productsData, usersData, departmentsData, ivaRate, config, onClose, onCheckin, onCheckout, onCancel, onNoShow, onCreate, onEdit, onAddPayment, onAddExtra, onRemoveExtra, onChangeExtraQty, onRemovePayment, onCloseInvoice, onViewGuest, onViewUnit, onAddGuest, onRemoveGuest, onChangeOwner }) {
  const alUnits = unitsData.filter((u) => u.type === "Alojamento Local");
  const [editing, setEditing] = useState(false);
  const [payAmount, setPayAmount] = useState("");
  const [payMethod, setPayMethod] = useState("Numerário");
  const extrasProducts = productsData.filter((p) => p.category !== "Restaurante");
  const [extraProductId, setExtraProductId] = useState(extrasProducts[0]?.id || "");
  const [confirmAction, setConfirmAction] = useState(null);
  const [cUser, setCUser] = useState(""); const [cPass, setCPass] = useState(""); const [cError, setCError] = useState("");
  const [addGuestOpen, setAddGuestOpen] = useState(false);
  const [addGuestInput, setAddGuestInput] = useState("");

  const [guestNameInput, setGuestNameInput] = useState("");
  const [additionalNames, setAdditionalNames] = useState([]);
  const [additionalInput, setAdditionalInput] = useState("");
  const [selUnit, setSelUnit] = useState(unitId || alUnits[0]?.id);
  const [ci, setCi] = useState(date || "");
  const [co, setCo] = useState(date ? isoDate(addDays(parseISO(date), 1)) : "");
  const [source, setSource] = useState("Direto");
  const [value, setValue] = useState(0);

  const [editGuest, setEditGuest] = useState("");
  const [editAdditional, setEditAdditional] = useState([]);
  const [editAdditionalInput, setEditAdditionalInput] = useState("");
  const [editCi, setEditCi] = useState("");
  const [editCo, setEditCo] = useState("");
  const [editSource, setEditSource] = useState("Direto");
  const [editValue, setEditValue] = useState(0);

  useEffect(() => {
    if (mode !== "create") return;
    const u = unitsData.find((x) => x.id === selUnit);
    if (u && u.nightlyRate && ci && co) { const n = nightsBetween(ci, co); if (n > 0) setValue(u.nightlyRate * n); }
  }, [selUnit, ci, co]);
  const createConflict = mode === "create" && ci && co ? reservationOverlaps(selUnit, ci, co, reservationsData) : null;

  function startEdit() {
    setEditGuest(guestName(reservation.ownerGuestId, guestsData));
    setEditAdditional((reservation.additionalGuestIds || []).map((id) => guestName(id, guestsData)));
    setEditCi(reservation.checkin); setEditCo(reservation.checkout);
    setEditSource(reservation.source); setEditValue(reservation.value);
    setEditing(true);
  }
  function submitConfirm() {
    const staffUser = usersData.find((u) => u.username === cUser && u.password === cPass && isFrontOffice(u, departmentsData));
    if (!staffUser) { setCError("Credenciais inválidas ou sem permissão de receção."); return; }
    if (confirmAction === "checkin") onCheckin(reservation, staffUser.name); else onCheckout(reservation, staffUser.name);
    onClose();
  }

  if (mode === "view") {
    const guest = guestsData.find((g) => g.id === reservation.ownerGuestId);
    const unitObj = unitsData.find((u) => u.id === reservation.unitId);
    const unitNameStr = unitObj?.name || "";
    const guestCount = 1 + (reservation.additionalGuestIds || []).length;
    const meta = reservationStatusMeta(reservation.status);
    const subtotal = reservationSubtotal(reservation);
    const ivaAmount = subtotal * (ivaRate / 100);
    const touristTax = reservationTouristTax(reservation, config);
    const total = reservationTotal(reservation, ivaRate, config);
    const pago = reservationPago(reservation);
    const saldo = reservationSaldo(reservation, ivaRate, config);

    return (
      <div className="fixed inset-0 z-40 flex items-center justify-center p-4" style={{ backgroundColor: "rgba(20,15,10,0.5)" }} onClick={onClose}>
        <div onClick={(e) => e.stopPropagation()} className="w-full rounded-2xl p-5" style={{ backgroundColor: C.card, maxWidth: 420, maxHeight: "90vh", overflowY: "auto" }}>
          {editing ? (
            <>
              <div className="text-base font-semibold mb-3" style={{ color: C.ink }}>Editar reserva {reservation.numero}</div>
              <div className="space-y-2.5 mb-4">
                <Field label="Hóspede principal">
                  <input list="guest-names-edit" value={editGuest} onChange={(e) => setEditGuest(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
                  <datalist id="guest-names-edit">{guestsData.map((g) => <option key={g.id} value={g.name} />)}</datalist>
                </Field>
                <Field label="Hóspedes adicionais">
                  {editAdditional.length > 0 && (
                    <div className="flex flex-wrap gap-1.5 mb-1.5">
                      {editAdditional.map((n, i) => (
                        <span key={i} className="flex items-center gap-1 px-2 py-1 rounded-full text-xs" style={{ backgroundColor: C.bg, color: C.ink }}>
                          {n}<button onClick={() => setEditAdditional(editAdditional.filter((_, j) => j !== i))}><X size={10} color={C.terracotta} /></button>
                        </span>
                      ))}
                    </div>
                  )}
                  <div className="flex gap-1.5">
                    <input list="guest-names-edit" value={editAdditionalInput} onChange={(e) => setEditAdditionalInput(e.target.value)} placeholder="Nome do hóspede adicional" className="flex-1 min-w-0 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
                    <button onClick={() => { if (editAdditionalInput.trim()) { setEditAdditional([...editAdditional, editAdditionalInput.trim()]); setEditAdditionalInput(""); } }} className="px-3 py-2 rounded-lg text-xs font-medium text-white shrink-0" style={{ backgroundColor: C.clay }}>+</button>
                  </div>
                </Field>
                <div className="grid grid-cols-2 gap-2">
                  <Field label="Check-in"><input type="date" value={editCi} onChange={(e) => setEditCi(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm" style={inputStyle} /></Field>
                  <Field label="Check-out"><input type="date" value={editCo} onChange={(e) => setEditCo(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm" style={inputStyle} /></Field>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <Field label="Origem"><select value={editSource} onChange={(e) => setEditSource(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm" style={{ ...inputStyle, backgroundColor: "#fff" }}><option>Direto</option><option>Airbnb</option><option>Booking.com</option></select></Field>
                  <Field label="Valor (€)"><input type="number" value={editValue} onChange={(e) => setEditValue(Number(e.target.value))} className="w-full px-2 py-2 rounded-lg border text-sm" style={inputStyle} /></Field>
                </div>
              </div>
              <div className="flex flex-col gap-2">
                <button onClick={() => { onEdit(reservation.id, { guestName: editGuest, additionalNames: editAdditional, checkin: editCi, checkout: editCo, source: editSource, value: editValue }); onClose(); }}
                  disabled={!editGuest || !editCi || !editCo} style={{ backgroundColor: C.oliveDark, opacity: (!editGuest || !editCi || !editCo) ? 0.5 : 1 }} className="py-2.5 rounded-full text-sm font-medium text-white">Guardar alterações</button>
                <button onClick={() => setEditing(false)} className="py-2 text-xs" style={{ color: C.inkSoft }}>Cancelar edição</button>
              </div>
            </>
          ) : (
            <>
              <div className="flex items-start justify-between mb-1">
                <button onClick={() => onViewGuest(reservation.ownerGuestId)} className="text-base font-semibold underline decoration-dotted" style={{ color: C.ink }}>{guest?.name || "—"}</button>
                <Pill color={meta.color}>{meta.label}</Pill>
              </div>
              {guest && !guestDocComplete(guest) && <div className="mb-2"><Pill color={C.terracotta}>Ficha incompleta — falta identificação legal</Pill></div>}
              <div className="text-xs mb-3" style={{ color: C.inkSoft }}>Reserva <strong style={{ color: C.ink }}>{reservation.numero}</strong> · <button onClick={() => onViewUnit(reservation.unitId)} className="underline decoration-dotted" style={{ color: C.inkSoft }}>{unitNameStr}</button></div>

              <Card className="p-3 mb-3">
                <div className="flex items-center justify-between mb-2">
                  <div className="text-xs font-semibold" style={{ color: C.ink }}>Hóspedes</div>
                  <span className="text-xs" style={{ color: guestCount >= (unitObj?.capacity || 99) ? C.terracotta : C.inkSoft }}>{guestCount}{unitObj?.capacity ? ` / ${unitObj.capacity}` : ""}</span>
                </div>
                <div className="space-y-1.5 mb-2">
                  <div className="flex items-center justify-between text-xs">
                    <button onClick={() => onViewGuest(reservation.ownerGuestId)} className="underline decoration-dotted" style={{ color: C.ink }}>{guest?.name || "—"}</button>
                    <Pill color={C.olive}>Principal</Pill>
                  </div>
                  {(reservation.additionalGuestIds || []).map((gid) => (
                    <div key={gid} className="flex items-center justify-between text-xs gap-2">
                      <button onClick={() => onViewGuest(gid)} className="underline decoration-dotted" style={{ color: C.ink }}>{guestName(gid, guestsData)}</button>
                      <div className="flex items-center gap-1.5 shrink-0">
                        <button onClick={() => onChangeOwner(reservation.id, gid)} className="text-xs" style={{ color: C.inkSoft }}>Tornar principal</button>
                        <button onClick={() => onRemoveGuest(reservation.id, gid)}><X size={11} color={C.terracotta} /></button>
                      </div>
                    </div>
                  ))}
                </div>
                {addGuestOpen ? (
                  <div className="flex gap-1.5">
                    <input list="guest-names-add" value={addGuestInput} onChange={(e) => setAddGuestInput(e.target.value)} placeholder="Nome do hóspede" className="flex-1 min-w-0 px-2 py-1.5 rounded-lg border text-xs" style={inputStyle} />
                    <datalist id="guest-names-add">{guestsData.map((g) => <option key={g.id} value={g.name} />)}</datalist>
                    <button onClick={() => { if (addGuestInput.trim()) { onAddGuest(reservation.id, addGuestInput.trim()); setAddGuestInput(""); setAddGuestOpen(false); } }} className="px-2.5 py-1.5 rounded-lg text-xs font-medium text-white shrink-0" style={{ backgroundColor: C.clay }}>+</button>
                    <button onClick={() => setAddGuestOpen(false)} className="text-xs px-1 shrink-0" style={{ color: C.inkSoft }}>×</button>
                  </div>
                ) : (
                  <button disabled={unitObj?.capacity && guestCount >= unitObj.capacity} onClick={() => setAddGuestOpen(true)} style={{ color: unitObj?.capacity && guestCount >= unitObj.capacity ? C.stone : C.oliveDark }} className="text-xs font-medium">+ Adicionar Hóspede</button>
                )}
              </Card>

              <div className="text-xs mb-1" style={{ color: C.inkSoft }}>Check-in: <span style={{ color: C.ink }}>{fmtShort(reservation.checkin)}</span></div>
              <div className="text-xs mb-1" style={{ color: C.inkSoft }}>Check-out: <span style={{ color: C.ink }}>{fmtShort(reservation.checkout)}</span></div>
              <div className="text-xs mb-3" style={{ color: C.inkSoft }}>Origem: <span style={{ color: C.ink }}>{reservation.source}</span></div>
              {reservation.checkedInBy && <div className="text-xs mb-1" style={{ color: C.inkSoft }}>Check-in confirmado por: <span style={{ color: C.ink }}>{reservation.checkedInBy}</span></div>}
              {reservation.checkedOutBy && <div className="text-xs mb-3" style={{ color: C.inkSoft }}>Check-out confirmado por: <span style={{ color: C.ink }}>{reservation.checkedOutBy}</span></div>}

              <Card className="p-3 mb-3">
                <div className="flex items-center gap-1.5 mb-2 text-xs font-semibold" style={{ color: C.ink }}><Receipt size={13} /> Faturação</div>
                <div className="text-xs flex justify-between mb-0.5" style={{ color: C.inkSoft }}><span>Estadia</span><span>€{reservation.value.toFixed(2)}</span></div>
                {(reservation.extras || []).map((e) => (
                  <div key={e.id} className="text-xs flex justify-between items-center mb-0.5 gap-1" style={{ color: C.inkSoft }}>
                    <span className="flex-1 min-w-0 truncate">{e.name} × {e.qty}{e.status === "pending" && <span className="ml-1.5" style={{ color: C.clay }}>· aguarda aprovação</span>}</span>
                    <span className="shrink-0">€{(e.price * e.qty).toFixed(2)}</span>
                    {!reservation.invoiceClosed && (
                      <span className="flex items-center gap-1 shrink-0">
                        <button onClick={() => onChangeExtraQty(reservation.id, e.id, -1)} className="w-4 h-4 rounded-full border flex items-center justify-center" style={{ borderColor: C.line, color: C.inkSoft, lineHeight: 1 }} title="Reduzir quantidade">−</button>
                        <button onClick={() => onChangeExtraQty(reservation.id, e.id, 1)} className="w-4 h-4 rounded-full border flex items-center justify-center" style={{ borderColor: C.line, color: C.inkSoft, lineHeight: 1 }} title="Aumentar quantidade">+</button>
                        <button onClick={() => onRemoveExtra(reservation.id, e.id)} title="Remover artigo"><X size={11} color={C.terracotta} /></button>
                      </span>
                    )}
                  </div>
                ))}
                <div className="text-xs flex justify-between mb-0.5" style={{ color: C.inkSoft }}><span>IVA ({ivaRate}%)</span><span>€{ivaAmount.toFixed(2)}</span></div>
                {touristTax > 0 && <div className="text-xs flex justify-between mb-0.5" style={{ color: C.inkSoft }}><span>Taxa turística</span><span>€{touristTax.toFixed(2)}</span></div>}
                <div className="text-xs flex justify-between font-semibold mb-1.5 pb-1.5 border-b" style={{ color: C.ink, borderColor: C.line }}><span>Total</span><span>€{total.toFixed(2)}</span></div>
                {(reservation.pagamentos || []).map((p) => (
                  <div key={p.id} className="text-xs flex justify-between items-center gap-1" style={{ color: C.inkSoft }}>
                    <span className="flex-1 min-w-0 truncate">{p.metodo}</span>
                    <span className="shrink-0">€{p.valor.toFixed(2)}</span>
                    {!reservation.invoiceClosed && <button onClick={() => onRemovePayment(reservation.id, p.id)} className="shrink-0" title="Remover pagamento"><X size={11} color={C.terracotta} /></button>}
                  </div>
                ))}
                <div className="text-xs flex justify-between font-semibold mt-1" style={{ color: saldo > 0.01 ? C.terracotta : C.ink }}><span>Saldo</span><span>€{saldo.toFixed(2)}</span></div>

                {!reservation.invoiceClosed && extrasProducts.length > 0 && (
                  <div className="flex gap-2 mt-2.5">
                    <select value={extraProductId} onChange={(e) => setExtraProductId(e.target.value)} className="flex-1 min-w-0 px-2 py-1.5 rounded-lg border text-xs" style={{ ...inputStyle, backgroundColor: "#fff" }}>
                      {extrasProducts.map((p) => <option key={p.id} value={p.id}>{p.name} — €{p.price.toFixed(2)}</option>)}
                    </select>
                    <button onClick={() => onAddExtra(reservation.id, extrasProducts.find((p) => p.id === extraProductId))} className="px-3 py-1.5 rounded-lg text-xs font-medium text-white shrink-0" style={{ backgroundColor: C.clay }}>+ artigo</button>
                  </div>
                )}
                {!reservation.invoiceClosed && (
                  <div className="flex gap-2 mt-2">
                    <input value={payAmount} onChange={(e) => setPayAmount(e.target.value)} type="number" placeholder="Valor €" className="flex-1 min-w-0 px-2 py-1.5 rounded-lg border text-xs" style={inputStyle} />
                    <select value={payMethod} onChange={(e) => setPayMethod(e.target.value)} className="px-2 py-1.5 rounded-lg border text-xs" style={{ ...inputStyle, backgroundColor: "#fff" }}><option>Numerário</option><option>Multibanco</option><option>Transferência</option></select>
                    <button disabled={!payAmount} onClick={() => { onAddPayment(reservation.id, { valor: payAmount, metodo: payMethod }); setPayAmount(""); }} style={{ backgroundColor: C.oliveDark, opacity: !payAmount ? 0.5 : 1 }} className="px-3 py-1.5 rounded-lg text-xs font-medium text-white shrink-0">+ pag.</button>
                  </div>
                )}
                <div className="flex gap-2 mt-2.5">
                  <button onClick={() => downloadInvoice(reservation, unitsData.find((u) => u.id === reservation.unitId), guest, ivaRate, config)} className="flex-1 py-2 rounded-full text-xs font-medium border" style={{ borderColor: C.line, color: C.ink }}>Descarregar Fatura</button>
                  {!reservation.invoiceClosed ? (
                    <button disabled={saldo > 0.01} onClick={() => onCloseInvoice(reservation.id)} style={{ backgroundColor: C.oliveDark, opacity: saldo > 0.01 ? 0.5 : 1 }} className="flex-1 py-2 rounded-full text-xs font-medium text-white">Fechar Fatura</button>
                  ) : (
                    <span className="flex-1 py-2 rounded-full text-xs font-medium text-center" style={{ backgroundColor: C.olive + "22", color: C.oliveDark }}>Fatura fechada</span>
                  )}
                </div>
              </Card>

              {confirmAction ? (
                <Card className="p-3 mb-2">
                  <div className="text-xs font-medium mb-1" style={{ color: C.ink }}>Reserva {reservation.numero} — confirmar {confirmAction === "checkin" ? "check-in" : "check-out"}</div>
                  <p className="text-xs mb-2" style={{ color: C.inkSoft }}>Introduz os teus dados de funcionário para confirmar.</p>
                  <input value={cUser} onChange={(e) => setCUser(e.target.value)} placeholder="Utilizador" className="w-full mb-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
                  <input type="password" value={cPass} onChange={(e) => setCPass(e.target.value)} placeholder="Password" className="w-full mb-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle} onKeyDown={(e) => { if (e.key === "Enter") submitConfirm(); }} />
                  {cError && <p className="text-xs mb-2" style={{ color: C.terracotta }}>{cError}</p>}
                  <div className="flex gap-2">
                    <button onClick={submitConfirm} className="flex-1 py-2 rounded-full text-xs font-medium text-white" style={{ backgroundColor: C.oliveDark }}>Confirmar</button>
                    <button onClick={() => { setConfirmAction(null); setCError(""); }} className="flex-1 py-2 rounded-full text-xs font-medium border" style={{ borderColor: C.line, color: C.inkSoft }}>Cancelar</button>
                  </div>
                </Card>
              ) : (
                <div className="flex flex-col gap-2">
                  {reservation.status === "confirmed" && <button onClick={() => setConfirmAction("checkin")} className="py-2.5 rounded-full text-sm font-medium text-white" style={{ backgroundColor: C.terracotta }}>Fazer check-in</button>}
                  {reservation.status === "checked-in" && <button onClick={() => setConfirmAction("checkout")} className="py-2.5 rounded-full text-sm font-medium text-white" style={{ backgroundColor: C.oliveDark }}>Fazer check-out</button>}
                  <button onClick={startEdit} className="py-2.5 rounded-full text-sm font-medium border" style={{ borderColor: C.line, color: C.ink }}>Editar reserva</button>
                  {(reservation.status === "confirmed" || reservation.status === "checked-in") && <button onClick={() => { onCancel(reservation); onClose(); }} className="py-2 text-xs" style={{ color: C.terracotta }}>Cancelar reserva</button>}
                  {reservation.status === "confirmed" && <button onClick={() => { onNoShow(reservation); onClose(); }} className="py-2 text-xs" style={{ color: C.inkSoft }}>Marcar como no-show</button>}
                  {reservation.status === "cancelled" && reservation.cancelReason && <p className="text-xs" style={{ color: C.inkSoft }}>Motivo: {reservation.cancelReason}</p>}
                  <button onClick={onClose} className="py-1 text-xs" style={{ color: C.inkSoft }}>Fechar</button>
                </div>
              )}
            </>
          )}
        </div>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center p-4" style={{ backgroundColor: "rgba(20,15,10,0.5)" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="w-full rounded-2xl p-5" style={{ backgroundColor: C.card, maxWidth: 420, maxHeight: "85vh", overflowY: "auto" }}>
        <div className="text-base font-semibold mb-3" style={{ color: C.ink }}>Nova reserva</div>
        <div className="space-y-2.5 mb-4">
          <Field label="Unidade"><select value={selUnit} onChange={(e) => setSelUnit(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm" style={{ ...inputStyle, backgroundColor: "#fff" }}>{alUnits.map((u) => <option key={u.id} value={u.id}>{u.name}</option>)}</select></Field>
          <Field label="Hóspede principal">
            <input list="guest-names-new" value={guestNameInput} onChange={(e) => setGuestNameInput(e.target.value)} placeholder="Nome do hóspede" className="w-full px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
            <datalist id="guest-names-new">{guestsData.map((g) => <option key={g.id} value={g.name} />)}</datalist>
          </Field>
          <Field label="Hóspedes adicionais">
            {additionalNames.length > 0 && (
              <div className="flex flex-wrap gap-1.5 mb-1.5">
                {additionalNames.map((n, i) => (
                  <span key={i} className="flex items-center gap-1 px-2 py-1 rounded-full text-xs" style={{ backgroundColor: C.bg, color: C.ink }}>
                    {n}<button onClick={() => setAdditionalNames(additionalNames.filter((_, j) => j !== i))}><X size={10} color={C.terracotta} /></button>
                  </span>
                ))}
              </div>
            )}
            <div className="flex gap-1.5">
              <input list="guest-names-new" value={additionalInput} onChange={(e) => setAdditionalInput(e.target.value)} placeholder="Nome do hóspede adicional" className="flex-1 min-w-0 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
              <button onClick={() => { if (additionalInput.trim()) { setAdditionalNames([...additionalNames, additionalInput.trim()]); setAdditionalInput(""); } }} className="px-3 py-2 rounded-lg text-xs font-medium text-white shrink-0" style={{ backgroundColor: C.clay }}>+</button>
            </div>
          </Field>
          <div className="grid grid-cols-2 gap-2">
            <Field label="Check-in"><input type="date" value={ci} onChange={(e) => setCi(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm" style={inputStyle} /></Field>
            <Field label="Check-out"><input type="date" value={co} onChange={(e) => setCo(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm" style={inputStyle} /></Field>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <Field label="Origem"><select value={source} onChange={(e) => setSource(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm" style={{ ...inputStyle, backgroundColor: "#fff" }}><option>Direto</option><option>Airbnb</option><option>Booking.com</option></select></Field>
            <Field label="Valor (€)"><input type="number" value={value} onChange={(e) => setValue(Number(e.target.value))} className="w-full px-2 py-2 rounded-lg border text-sm" style={inputStyle} /></Field>
          </div>
          <p className="text-xs" style={{ color: C.inkSoft }}>O valor é sugerido a partir do tarifário da unidade — pode ser ajustado.</p>
          {createConflict && <p className="text-xs mt-2" style={{ color: C.terracotta }}>Conflito: {createConflict.numero} já ocupa esta unidade entre {fmtShort(createConflict.checkin)} e {fmtShort(createConflict.checkout)}.</p>}
        </div>
        <div className="flex flex-col gap-2">
          <button onClick={() => { onCreate({ unitId: selUnit, guestName: guestNameInput, additionalNames, checkin: ci, checkout: co, source, value }); onClose(); }}
            disabled={!guestNameInput || !ci || !co || !!createConflict} style={{ backgroundColor: C.oliveDark, opacity: (!guestNameInput || !ci || !co || createConflict) ? 0.5 : 1 }} className="py-2.5 rounded-full text-sm font-medium text-white">Criar reserva</button>
          <button onClick={onClose} className="py-2 text-xs" style={{ color: C.inkSoft }}>Cancelar</button>
        </div>
      </div>
    </div>
  );
}

/* Booking manager                                                        */
/* ---------------------------------------------------------------------- */

function BookingManager({ view, unitsData, reservationsData, guestsData, tasksData, maintenanceData, todayStr, productsData, usersData, departmentsData, ivaRate, config, todayDate, handlers, onSaveGuest, focusReservationId, onFocusHandled }) {
  const [modal, setModal] = useState(null);
  const [unitDrawerId, setUnitDrawerId] = useState(null);
  useEffect(() => {
    if (focusReservationId) { setModal({ mode: "view", reservationId: focusReservationId }); onFocusHandled(); }
  }, [focusReservationId]);
  const liveReservation = modal && modal.mode === "view" ? reservationsData.find((r) => r.id === modal.reservationId) : null;
  return (
    <>
      {view === "timeline" ? (
        <Timeline unitsData={unitsData} reservationsData={reservationsData} guestsData={guestsData} tasksData={tasksData} todayStr={todayStr} todayDate={todayDate}
          onOpenReservation={(r) => setModal({ mode: "view", reservationId: r.id })}
          onOpenUnit={(unitId) => setUnitDrawerId(unitId)}
          onCreateAt={(unitId, d) => setModal({ mode: "create", unitId, date: isoDate(d) })} />
      ) : (
        <div>
          <div className="flex items-center justify-between mb-3">
            <p className="text-xs" style={{ color: C.inkSoft }}>{reservationsData.length} reservas registadas</p>
            <button onClick={() => setModal({ mode: "create", unitId: unitsData.find((u) => u.type === "Alojamento Local")?.id, date: isoDate(todayDate) })} className="text-xs font-medium px-3 py-1.5 rounded-full text-white" style={{ backgroundColor: C.oliveDark }}>+ Nova reserva</button>
          </div>
          <ReservationsTable unitsData={unitsData} reservationsData={reservationsData} guestsData={guestsData} ivaRate={ivaRate} config={config} onOpen={(r) => setModal({ mode: "view", reservationId: r.id })} />
        </div>
      )}
      {modal && modal.mode === "view" && liveReservation && (
        <ReservationModal mode="view" reservation={liveReservation} unitsData={unitsData} reservationsData={reservationsData} guestsData={guestsData} productsData={productsData} usersData={usersData} departmentsData={departmentsData} ivaRate={ivaRate} config={config} onClose={() => setModal(null)}
          onCheckin={handlers.checkin} onCheckout={handlers.checkout} onCancel={handlers.cancel} onNoShow={handlers.noShow}
          onCreate={handlers.create} onEdit={handlers.edit} onAddPayment={handlers.addPayment} onAddExtra={handlers.addExtra} onRemoveExtra={handlers.removeExtra} onChangeExtraQty={handlers.changeExtraQty} onRemovePayment={handlers.removePayment} onCloseInvoice={handlers.closeInvoice}
          onAddGuest={handlers.addGuest} onRemoveGuest={handlers.removeGuest} onChangeOwner={handlers.changeOwner}
          onViewGuest={(gid) => setModal({ mode: "guest", guestId: gid })} onViewUnit={(unitId) => setUnitDrawerId(unitId)} />
      )}
      {modal && modal.mode === "create" && (
        <ReservationModal mode="create" unitId={modal.unitId} date={modal.date} reservationsData={reservationsData}
          unitsData={unitsData} guestsData={guestsData} productsData={productsData} usersData={usersData} departmentsData={departmentsData} ivaRate={ivaRate} config={config} onClose={() => setModal(null)}
          onCheckin={handlers.checkin} onCheckout={handlers.checkout} onCancel={handlers.cancel}
          onCreate={handlers.create} onEdit={handlers.edit} onAddPayment={handlers.addPayment} onAddExtra={handlers.addExtra} onRemoveExtra={handlers.removeExtra} onChangeExtraQty={handlers.changeExtraQty} onRemovePayment={handlers.removePayment} onCloseInvoice={handlers.closeInvoice}
          onViewGuest={(gid) => setModal({ mode: "guest", guestId: gid })} />
      )}
      {unitDrawerId && (
        <UnitDrawer unit={unitsData.find((u) => u.id === unitDrawerId)} reservationsData={reservationsData} guestsData={guestsData} tasksData={tasksData} maintenanceData={maintenanceData} todayStr={todayStr}
          onClose={() => setUnitDrawerId(null)} onOpenReservation={(id) => { setUnitDrawerId(null); setModal({ mode: "view", reservationId: id }); }} />
      )}
      {modal && modal.mode === "guest" && (
        <GuestProfileModal guest={guestsData.find((g) => g.id === modal.guestId)} reservationsData={reservationsData} unitsData={unitsData} ivaRate={ivaRate} config={config}
          onClose={() => setModal(null)} onSave={onSaveGuest} />
      )}
    </>
  );
}

function KanbanBoard({ tasksData, onAdvance }) {
  const cols = [{ key: "todo", label: "Por fazer" }, { key: "doing", label: "Em progresso" }, { key: "done", label: "Concluído" }];
  return (
    <div className="grid grid-cols-3 gap-3">
      {cols.map((col) => {
        const items = tasksData.filter((t) => t.status === col.key);
        return (
          <div key={col.key}>
            <div className="text-xs font-semibold mb-2 flex items-center justify-between" style={{ color: C.inkSoft }}><span>{col.label}</span><span>{items.length}</span></div>
            <div className="space-y-2">
              {items.map((t) => (
                <Card key={t.id} className="p-3">
                  <div className="text-xs font-medium mb-1" style={{ color: C.ink }}>{t.title}</div>
                  <div className="text-xs mb-2" style={{ color: C.inkSoft }}>{t.tag} · {t.due}</div>
                  {col.key !== "done" && <button onClick={() => onAdvance(t.id)} className="text-xs font-medium px-2.5 py-1 rounded-full text-white" style={{ backgroundColor: col.key === "todo" ? C.clay : C.oliveDark }}>{col.key === "todo" ? "Iniciar" : "Concluir"}</button>}
                </Card>
              ))}
              {items.length === 0 && <p className="text-xs" style={{ color: C.stone }}>Vazio</p>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function requestStatusMeta(status) {
  return status === "approved" ? { label: "Aprovado", color: C.olive } : status === "declined" ? { label: "Recusado", color: C.terracotta } : { label: "Pendente", color: C.clay };
}

function RequestsPanel({ requestsData, onToggle, onApprove, onDecline }) {
  return (
    <Card className="p-4">
      <div className="space-y-2">
        {requestsData.map((g) => {
          const needsApproval = !!g.extraId && !g.done;
          const meta = g.status ? requestStatusMeta(g.status) : null;
          return (
            <div key={g.id} className="pb-2 border-b" style={{ borderColor: C.line, opacity: g.done ? 0.6 : 1 }}>
              <div className="flex items-center justify-between gap-2">
                <div className="text-xs">
                  <div className="font-medium" style={{ color: C.ink }}>{g.unit} · {g.guest}</div>
                  <div style={{ color: C.inkSoft, textDecoration: g.done && !g.extraId ? "line-through" : "none" }}>{g.text} — {g.time}</div>
                </div>
                {needsApproval ? (
                  <div className="flex gap-1.5 shrink-0">
                    <button onClick={() => onApprove(g.id)} className="text-xs font-medium px-2.5 py-1 rounded-full text-white" style={{ backgroundColor: C.oliveDark }}>Aprovar</button>
                    <button onClick={() => onDecline(g.id)} className="text-xs font-medium px-2.5 py-1 rounded-full border" style={{ borderColor: C.line, color: C.terracotta }}>Recusar</button>
                  </div>
                ) : (
                  <button onClick={() => onToggle(g.id)} className="p-1 rounded-full shrink-0" style={{ backgroundColor: g.done ? C.olive + "33" : C.line }}><Check size={12} color={g.done ? C.oliveDark : C.inkSoft} /></button>
                )}
              </div>
              {meta && <Pill color={meta.color}>{meta.label}</Pill>}
            </div>
          );
        })}
        {requestsData.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem pedidos por agora.</p>}
      </div>
    </Card>
  );
}

function UnitsList({ unitsData, reservationsData, guestsData, tasksData, todayStr }) {
  return (
    <div className="grid grid-cols-2 gap-3">
      {unitsData.map((u) => {
        const st = unitStatus(u, reservationsData, tasksData, todayStr);
        const cur = u.type === "Alojamento Local" ? currentReservationFor(u.id, reservationsData, todayStr) : null;
        return (
          <Card key={u.id} className="p-4">
            <div className="flex items-start justify-between mb-2">
              <div><div className="text-sm font-semibold" style={{ color: C.ink }}>{u.name}</div><div className="text-xs" style={{ color: C.inkSoft }}>{u.place} · {u.type}</div></div>
              <Pill color={st.color}>{st.label}</Pill>
            </div>
            {cur && <div className="text-xs" style={{ color: C.inkSoft }}>Hóspede atual: {guestName(cur.ownerGuestId, guestsData)} · até {fmtShort(cur.checkout)}</div>}
            {u.tenant && <div className="text-xs" style={{ color: C.inkSoft }}>Inquilino: {u.tenant}</div>}
            {u.nightlyRate && <div className="text-xs mt-1" style={{ color: C.inkSoft }}>Tarifa: €{u.nightlyRate}/noite</div>}
            {u.device && <div className="flex items-center gap-1 mt-2 text-xs" style={{ color: C.olive }}><Battery size={13} /> {u.device.battery}% · {u.device.locked ? "Trancado" : "Destrancado"}</div>}
          </Card>
        );
      })}

}

function DevicesPanel({ unitsData, onToggleDeviceLock }) {
  return (
    <div className="grid grid-cols-2 gap-3">
      {unitsData.filter((u) => u.device).map((u) => (
        <Card key={u.id} className="p-3.5 flex items-center justify-between">
          <div><div className="text-sm font-medium" style={{ color: C.ink }}>{u.name}</div><div className="flex items-center gap-1 text-xs mt-0.5" style={{ color: u.device.battery < 30 ? C.terracotta : C.inkSoft }}><Battery size={13} /> {u.device.battery}%</div></div>
          <button onClick={() => onToggleDeviceLock(u.id)} className="text-xs font-medium px-3 py-1.5 rounded-full text-white" style={{ backgroundColor: u.device.locked ? C.olive : C.terracotta }}>{u.device.locked ? "Trancado" : "Destrancado"}</button>
        </Card>
      ))}
    </div>
  );
}

function GuestsCRM({ guestsData, reservationsData, unitsData, ivaRate, config, onSaveGuest, focusGuestId, onFocusHandled }) {
  const [openId, setOpenId] = useState(null);
  useEffect(() => {
    if (focusGuestId) { setOpenId(focusGuestId); onFocusHandled(); }
  }, [focusGuestId]);
  const rows = guestsData.map((g) => {
    const stays = reservationsData.filter((r) => reservationIncludesGuest(r, g.id) && r.status !== "cancelled");
    const total = stays.reduce((s, r) => s + reservationTotal(r, ivaRate, config), 0);
    const lastDate = stays.reduce((max, r) => (r.checkin > max ? r.checkin : max), "");
    return { ...g, staysCount: stays.length, total, lastDate };
  }).sort((a, b) => b.lastDate.localeCompare(a.lastDate));
  return (
    <>
      <div className="grid grid-cols-2 gap-3">
        {rows.map((g) => (
          <Card key={g.id} className="p-3.5 flex items-center justify-between cursor-pointer" onClick={() => setOpenId(g.id)}>
            <div><div className="text-sm font-medium" style={{ color: C.ink }}>{g.name}</div><div className="text-xs" style={{ color: C.inkSoft }}>{g.staysCount} estadia{g.staysCount !== 1 ? "s" : ""}{g.email ? " · " + g.email : ""}</div></div>
            <div className="text-sm font-semibold" style={{ color: C.ink }}>€{g.total.toFixed(2)}</div>
          </Card>
        ))}
        {rows.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem hóspedes registados ainda.</p>}
      </div>
      {openId && <GuestProfileModal guest={guestsData.find((g) => g.id === openId)} reservationsData={reservationsData} unitsData={unitsData} ivaRate={ivaRate} config={config} onClose={() => setOpenId(null)} onSave={onSaveGuest} />}
    </>
  );
}

function MyDashboard({ authUser, departmentsData, tasksData, maintenanceData, requestsData, ordersData, onGoTo }) {
  const dept = departmentsData.find((d) => d.id === authUser.departmentId);
  const cards = [];
  if (dept?.moduleIds.includes("housekeeping")) cards.push({ label: "Tarefas por concluir", value: tasksData.filter((t) => t.status !== "done").length, goTo: "housekeeping" });
  if (dept?.moduleIds.includes("manutencao")) cards.push({ label: "Ocorrências abertas", value: maintenanceData.filter((m) => m.status !== "Resolvido").length, goTo: "manutencao" });
  if (dept?.moduleIds.includes("restaurante") || dept?.moduleIds.includes("cozinha")) cards.push({ label: "Pedidos em curso", value: ordersData.filter((o) => o.status !== "ready").length, goTo: dept?.moduleIds.includes("cozinha") && !dept?.moduleIds.includes("restaurante") ? "cozinha" : "restaurante" });
  if (dept?.moduleIds.includes("pedidos")) cards.push({ label: "Pedidos de hóspedes pendentes", value: requestsData.filter((r) => !r.done).length, goTo: "pedidos" });
  return (
    <div>
      <div className="mb-5">
        <h2 style={{ ...serif, color: C.ink }} className="text-xl mb-1">Olá, {authUser.name.split(" ")[0]}</h2>
        <p className="text-sm" style={{ color: C.inkSoft }}>{dept ? dept.name : ROLE_LABELS[authUser.role]} · {ROLE_LABELS[authUser.role]}</p>
      </div>
      {cards.length > 0 ? (
        <div className="grid grid-cols-3 gap-4">
          {cards.map((c) => <button key={c.label} onClick={() => onGoTo(c.goTo)} className="text-left"><Card className="p-4"><div className="text-xl font-semibold" style={{ color: C.ink }}>{c.value}</div><div className="text-xs" style={{ color: C.inkSoft }}>{c.label}</div></Card></button>)}
        </div>
      ) : (
        <p className="text-sm" style={{ color: C.inkSoft }}>Acesso técnico transversal: Dispositivos, Action Log e Configurações.</p>
      )}
    </div>
  );
}

function PainelSection({ unitsData, reservationsData, guestsData, maintenanceData, requestsData, ivaRate, config, todayStr, onOpenReservation, onGoTo }) {
  const alUnits = unitsData.filter((u) => u.type === "Alojamento Local");
  const occupied = alUnits.filter((u) => currentReservationFor(u.id, reservationsData, todayStr)).length;
  const occupancy = alUnits.length ? Math.round((occupied / alUnits.length) * 100) : 0;
  const pendingTotal = reservationsData.filter((r) => (r.status === "checked-in" || r.status === "checked-out") && reservationSaldo(r, ivaRate, config) > 0.01).reduce((s, r) => s + reservationSaldo(r, ivaRate, config), 0);
  const arrivals = reservationsData.filter((r) => r.checkin === todayStr && r.status !== "cancelled");
  const departures = reservationsData.filter((r) => r.checkout === todayStr && r.status !== "cancelled");
  const openMaint = maintenanceData.filter((m) => m.status !== "Resolvido").length;
  const pendingRequests = requestsData.filter((r) => !r.done).length;
  const unitName = (id) => unitsData.find((u) => u.id === id)?.name || id;
  const billable = reservationsData.filter((r) => r.status !== "cancelled" && r.status !== "no-show");
  const totalNights = billable.reduce((s, r) => s + Math.max(nightsBetween(r.checkin, r.checkout), 0), 0);
  const totalRoomRevenue = billable.reduce((s, r) => s + (r.value || 0), 0);
  const adr = totalNights > 0 ? totalRoomRevenue / totalNights : 0;
  const monthly = monthlyRevenue(reservationsData, parseISO(todayStr));
  const mix = channelMix(reservationsData);

  const kpis = [
    { label: "Taxa de ocupação", value: `${occupancy}%`, icon: Percent, tone: C.olive, onClick: () => onGoTo("calendario") },
    { label: "Diária média (ADR)", value: `€${adr.toFixed(0)}`, icon: Euro, tone: C.clay, onClick: () => onGoTo("reservas") },
    { label: "Pagamentos pendentes", value: `€${pendingTotal.toFixed(2)}`, icon: AlertCircle, tone: C.terracotta, onClick: () => onGoTo("reservas") },
    { label: "Unidades com manutenção", value: openMaint, icon: Wrench, tone: openMaint > 0 ? C.terracotta : C.olive, onClick: () => onGoTo("manutencao") },
    { label: "Pedidos de hóspedes pendentes", value: pendingRequests, icon: Bell, tone: pendingRequests > 0 ? C.clay : C.olive, onClick: () => onGoTo("pedidos") },
  ];

  return (
    <div>
      <div className="grid grid-cols-5 gap-3 mb-6">{kpis.map((k) => <button key={k.label} onClick={k.onClick} className="text-left"><Card className="p-3.5 h-full"><k.icon size={16} color={k.tone} className="mb-1.5" /><div className="text-base font-semibold" style={{ color: C.ink }}>{k.value}</div><div className="text-xs" style={{ color: C.inkSoft }}>{k.label}</div></Card></button>)}</div>
      <div className="grid grid-cols-3 gap-5 mb-5">
        <Card className="p-4 col-span-2">
          <div className="text-sm font-semibold mb-3" style={{ color: C.ink }}>Receita por mês (check-ins)</div>
          <SimpleBarChart data={monthly} height={200} />
        </Card>
        <Card className="p-4">
          <div className="text-sm font-semibold mb-3" style={{ color: C.ink }}>Origem das reservas</div>
          <div className="space-y-2.5">
            {mix.map(([source, count]) => {
              const pct = billable.length ? Math.round((count / reservationsData.filter((r) => r.status !== "cancelled").length) * 100) : 0;
              return (
                <div key={source}>
                  <div className="flex justify-between text-xs mb-1"><span style={{ color: C.ink }}>{source}</span><span style={{ color: C.inkSoft }}>{count}</span></div>
                  <div className="h-1.5 rounded-full" style={{ backgroundColor: C.bg }}><div className="h-1.5 rounded-full" style={{ width: `${pct}%`, backgroundColor: C.clay }} /></div>
                </div>
              );
            })}
            {mix.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem reservas ainda.</p>}
          </div>
        </Card>
      </div>
      <div className="grid grid-cols-2 gap-5">
        <Card className="p-4"><div className="text-sm font-semibold mb-3" style={{ color: C.ink }}>Chegadas hoje</div><div className="space-y-2">{arrivals.map((r) => <button key={r.id} onClick={() => onOpenReservation(r.id)} className="w-full text-left text-xs pb-2 border-b block" style={{ borderColor: C.line }}><span className="font-medium" style={{ color: C.ink }}>{guestName(r.ownerGuestId, guestsData)}</span> <span style={{ color: C.inkSoft }}>· {unitName(r.unitId)}</span></button>)}{arrivals.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem chegadas hoje.</p>}</div></Card>
        <Card className="p-4"><div className="text-sm font-semibold mb-3" style={{ color: C.ink }}>Saídas hoje</div><div className="space-y-2">{departures.map((r) => <button key={r.id} onClick={() => onOpenReservation(r.id)} className="w-full text-left text-xs pb-2 border-b block" style={{ borderColor: C.line }}><span className="font-medium" style={{ color: C.ink }}>{guestName(r.ownerGuestId, guestsData)}</span> <span style={{ color: C.inkSoft }}>· {unitName(r.unitId)}</span></button>)}{departures.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem saídas hoje.</p>}</div></Card>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Maintenance, sales & rates, restaurant / kitchen, cash, users, log, config, concierge */

const MAINT_CATS = ["Elétrica", "Canalização", "AVAC", "Mobiliário", "Exterior/Jardim", "Outro"];
const MAINT_PRIORITIES = ["Baixa", "Média", "Alta", "Urgente"];
function maintPriorityColor(p) { return p === "Urgente" ? C.terracotta : p === "Alta" ? C.clay : p === "Média" ? C.stone : C.olive; }

function MaintenancePanel({ unitsData, maintenanceData, onCreate, onAdvance }) {
  const [open, setOpen] = useState(false);
  const [unitId, setUnitId] = useState(unitsData[0]?.id);
  const [category, setCategory] = useState(MAINT_CATS[0]);
  const [title, setTitle] = useState("");
  const [priority, setPriority] = useState("Média");
  const unitName = (id) => unitsData.find((u) => u.id === id)?.name || id;
  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <p className="text-xs" style={{ color: C.inkSoft }}>{maintenanceData.length} ocorrências</p>
        <button onClick={() => setOpen((o) => !o)} className="text-xs font-medium px-3 py-1.5 rounded-full text-white" style={{ backgroundColor: C.oliveDark }}>+ Nova ocorrência</button>
      </div>
      {open && (
        <Card className="p-4 mb-4">
          <div className="grid grid-cols-2 gap-2 mb-2">
            <Field label="Unidade"><select value={unitId} onChange={(e) => setUnitId(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm" style={{ ...inputStyle, backgroundColor: "#fff" }}>{unitsData.map((u) => <option key={u.id} value={u.id}>{u.name}</option>)}</select></Field>
            <Field label="Categoria"><select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm" style={{ ...inputStyle, backgroundColor: "#fff" }}>{MAINT_CATS.map((c) => <option key={c}>{c}</option>)}</select></Field>
          </div>
          <Field label="Título"><input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Ex: Torneira a pingar" className="w-full px-3 py-2 rounded-lg border text-sm mb-2" style={inputStyle} /></Field>
          <Field label="Prioridade"><select value={priority} onChange={(e) => setPriority(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm mb-3" style={{ ...inputStyle, backgroundColor: "#fff" }}>{MAINT_PRIORITIES.map((p) => <option key={p}>{p}</option>)}</select></Field>
          <button disabled={!title} onClick={() => { onCreate({ unitId, category, title, priority }); setTitle(""); setOpen(false); }} style={{ backgroundColor: C.oliveDark, opacity: !title ? 0.5 : 1 }} className="w-full py-2.5 rounded-full text-sm font-medium text-white">Registar ocorrência</button>
        </Card>

function TableGlyph({ size = 70, color, label, chairs = 4 }) {
  const chairSize = size * 0.24;
  const pad = chairSize * 0.75;
  const total = size + pad * 2;
  const cx = total / 2, cy = total / 2, r = size / 2;
  const n = Math.min(chairs, 8);
  const chairEls = [];
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    const cxp = cx + Math.cos(angle) * (r + pad * 0.8);
    const cyp = cy + Math.sin(angle) * (r + pad * 0.8);
    chairEls.push(<rect key={i} x={cxp - chairSize / 2} y={cyp - chairSize / 2} width={chairSize} height={chairSize} rx={3} fill={color} opacity="0.55" />);
  }
  return (
    <svg width={total} height={total}>
      {chairEls}
      <circle cx={cx} cy={cy} r={r} fill={color + "22"} stroke={color} strokeWidth="2" />
      <text x={cx} y={cy + size * 0.1} textAnchor="middle" fontSize={size * 0.3} fontWeight="700" fill={C.ink}>{label}</text>
    </svg>
  );
}

function FloorPlanCanvas({ tables, markers, editMode, statusFor, statusColor, statusLabel, onSelectTable, onMoveTable, onMoveMarker }) {
  const canvasRef = useRef(null);
  const dragRef = useRef(null);
  function posFromEvent(e) {
    const rect = canvasRef.current.getBoundingClientRect();
    const x = Math.min(97, Math.max(3, ((e.clientX - rect.left) / rect.width) * 100));
    const y = Math.min(93, Math.max(3, ((e.clientY - rect.top) / rect.height) * 100));
    return { x, y };
  }
  function handleDown(kind, id) { return (e) => { e.preventDefault(); dragRef.current = { kind, id }; }; }
  function handleMove(e) {
    if (!dragRef.current) return;
    const { x, y } = posFromEvent(e);
    if (dragRef.current.kind === "table") onMoveTable(dragRef.current.id, x, y); else onMoveMarker(dragRef.current.id, x, y);
  }
  function handleUp() { dragRef.current = null; }
  return (
    <div ref={canvasRef} onPointerMove={editMode ? handleMove : undefined} onPointerUp={editMode ? handleUp : undefined} onPointerLeave={editMode ? handleUp : undefined}
      className="relative rounded-2xl border" style={{ height: 420, backgroundColor: C.card, borderColor: C.line, backgroundImage: `radial-gradient(circle, ${C.line} 1px, transparent 1px)`, backgroundSize: "22px 22px" }}>
      {markers.map((m) => (
        <div key={m.id} onPointerDown={editMode ? handleDown("marker", m.id) : undefined} className="absolute flex items-center gap-1 rounded-lg px-2 py-1 text-xs font-medium"
          style={{ left: `${m.x}%`, top: `${m.y}%`, transform: "translate(-50%,-50%)", backgroundColor: C.sidebar, color: "#fff", cursor: editMode ? "grab" : "default" }}>
          {m.type === "porta" ? "Porta" : "Balcão"}
        </div>
      ))}
      {tables.map((t) => {
        const st = statusFor(t.id);
        const size = t.capacity <= 2 ? 62 : t.capacity <= 4 ? 78 : 94;
        return (
          <div key={t.id} onPointerDown={editMode ? handleDown("table", t.id) : undefined} onClick={!editMode ? () => onSelectTable(t.id) : undefined}
            className="absolute flex flex-col items-center" style={{ left: `${t.x}%`, top: `${t.y}%`, transform: "translate(-50%,-50%)", cursor: editMode ? "grab" : "pointer" }}>
            <TableGlyph size={size} color={statusColor[st]} label={t.label.replace(/^Mesa\s*/i, "")} chairs={t.capacity} />
            <div className="text-xs font-medium mt-0.5" style={{ color: statusColor[st] }}>{statusLabel[st]}</div>
          </div>
        );
      })}
    </div>
  );
}

function TableBookingForm({ unitsData, reservationsData, guestsData, tablesData, tableBookingsData, todayStr, initialTableId, onCreate }) {
  const [tableId, setTableId] = useState(initialTableId || tablesData[0]?.id);
  const [date, setDate] = useState(todayStr);
  const [time, setTime] = useState("19:00");
  const [partySize, setPartySize] = useState(2);
  const [guestType, setGuestType] = useState("hospede");
  const [linkedUnitId, setLinkedUnitId] = useState("");
  const [externalName, setExternalName] = useState("");

  const activeUnits = unitsData.filter((u) => u.type === "Alojamento Local" && currentReservationFor(u.id, reservationsData, todayStr));
  const free = tableIsFree(tableId, date, time, tableBookingsData);
  const alternatives = !free ? suggestedSlots(tableId, date, tableBookingsData, 6) : [];

  function submit() {
    const res = guestType === "hospede" ? currentReservationFor(linkedUnitId, reservationsData, todayStr) : null;
    const gName = guestType === "hospede" ? (res ? guestName(res.ownerGuestId, guestsData) : "") : externalName.trim();
    if (!gName || !tableIsFree(tableId, date, time, tableBookingsData)) return;
    onCreate({ tableId, date, time, partySize, guestName: gName, guestType, reservationId: res ? res.id : null });
    setExternalName(""); setLinkedUnitId("");
  }

  return (
    <Card className="p-5" style={{ maxWidth: 460 }}>
      <div className="grid grid-cols-2 gap-2 mb-2">
        <Field label="Mesa">
          <select value={tableId} onChange={(e) => setTableId(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm" style={{ ...inputStyle, backgroundColor: "#fff" }}>
            {tablesData.map((t) => <option key={t.id} value={t.id}>{t.label} · {t.capacity}p</option>)}
          </select>
        </Field>
        <Field label="Pessoas"><input type="number" value={partySize} onChange={(e) => setPartySize(Number(e.target.value))} className="w-full px-2 py-2 rounded-lg border text-sm" style={inputStyle} /></Field>
      </div>
      <div className="grid grid-cols-2 gap-2 mb-2">
        <Field label="Data"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm" style={inputStyle} /></Field>
        <Field label="Hora"><input type="time" value={time} onChange={(e) => setTime(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm" style={inputStyle} /></Field>
      </div>
      <p className="text-xs mb-3" style={{ color: free ? C.olive : C.terracotta }}>
        {free ? "Horário disponível para esta mesa (slot de 1h30)." : `Ocupado. Sugestões: ${alternatives.join(", ") || "sem horários livres hoje"}`}
      </p>
      <Field label="Tipo de cliente">
        <div className="flex gap-2 mb-2">
          <button onClick={() => setGuestType("hospede")} className="flex-1 py-2 rounded-lg text-xs font-medium border" style={guestType === "hospede" ? { backgroundColor: C.oliveDark, color: "#fff", borderColor: C.oliveDark } : { borderColor: C.line, color: C.inkSoft }}>Hóspede do alojamento</button>
          <button onClick={() => setGuestType("externo")} className="flex-1 py-2 rounded-lg text-xs font-medium border" style={guestType === "externo" ? { backgroundColor: C.oliveDark, color: "#fff", borderColor: C.oliveDark } : { borderColor: C.line, color: C.inkSoft }}>Cliente externo</button>
        </div>
      </Field>
      {guestType === "hospede" ? (
        <Field label="Unidade">
          <select value={linkedUnitId} onChange={(e) => setLinkedUnitId(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm mb-3" style={{ ...inputStyle, backgroundColor: "#fff" }}>
            <option value="">Escolher…</option>
            {activeUnits.map((u) => <option key={u.id} value={u.id}>{u.name} — {guestName(currentReservationFor(u.id, reservationsData, todayStr)?.ownerGuestId, guestsData)}</option>)}
          </select>
        </Field>
      ) : (
        <Field label="Nome do cliente"><input value={externalName} onChange={(e) => setExternalName(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm mb-3" style={inputStyle} /></Field>
      )}
      <p className="text-xs mb-3" style={{ color: C.inkSoft }}>Clientes externos pagam sempre no local; hóspedes do alojamento podem escolher fatura para o quarto ou pagamento imediato ao fechar a conta.</p>
      <button onClick={submit} disabled={!free} style={{ backgroundColor: C.oliveDark, opacity: !free ? 0.5 : 1 }} className="w-full py-2.5 rounded-full text-sm font-medium text-white">Criar reserva de mesa</button>
    </Card>
  );
}

function ChatSection({ unitsData, reservationsData, guestsData, messagesData, todayStr, onSend, onMarkRead }) {
  const activeReservations = reservationsData.filter((r) => r.status === "checked-in" && todayStr >= r.checkin && todayStr < r.checkout);
  const [activeTab, setActiveTab] = useState(activeReservations[0]?.id || null);
  const [text, setText] = useState("");
  useEffect(() => { if (activeTab) onMarkRead(activeTab); }, [activeTab]);
  const threadMsgs = messagesData.filter((m) => m.reservationId === activeTab).sort((a, b) => a.when - b.when);
  const activeRes = activeReservations.find((r) => r.id === activeTab);
  function submit() { if (!text.trim() || !activeTab) return; onSend({ reservationId: activeTab, unitId: activeRes?.unitId, sender: "staff", text }); setText(""); }
  return (
    <div>
      <div className="flex gap-2 mb-3 overflow-x-auto pb-1">
        {activeReservations.map((r) => {
          const unitNameStr = unitsData.find((u) => u.id === r.unitId)?.name || "";
          const unread = messagesData.filter((m) => m.reservationId === r.id && m.sender === "guest" && !m.read).length;
          const active = activeTab === r.id;
          return (
            <button key={r.id} onClick={() => setActiveTab(r.id)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs border shrink-0"
              style={active ? { backgroundColor: C.oliveDark, color: "#fff", borderColor: C.oliveDark } : { borderColor: C.line, color: C.inkSoft }}>
              {guestName(r.ownerGuestId, guestsData)} · {unitNameStr}
              {unread > 0 && <span className="rounded-full px-1.5" style={{ backgroundColor: active ? "#fff" : C.terracotta, color: active ? C.oliveDark : "#fff" }}>{unread}</span>}
            </button>
          );
        })}
        {activeReservations.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem estadias ativas neste momento.</p>}
      </div>
      {activeTab && (
        <Card className="p-4 flex flex-col" style={{ height: 480, maxWidth: 560 }}>
          <div className="flex-1 overflow-y-auto space-y-2 mb-3 pr-1">
            {threadMsgs.map((m) => (
              <div key={m.id} className={`flex ${m.sender === "staff" ? "justify-end" : "justify-start"}`}>
                <div className="rounded-2xl px-3 py-2 text-xs" style={{ maxWidth: "78%", backgroundColor: m.sender === "staff" ? C.oliveDark : C.bg, color: m.sender === "staff" ? "#fff" : C.ink }}>
                  {m.text}
                  <div className="text-xs mt-1" style={{ opacity: 0.7 }}>{fmtWhen(m.when)}</div>
                </div>
              </div>
            ))}
            {threadMsgs.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem mensagens ainda.</p>}
          </div>
          <div className="flex gap-2">
            <input value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") submit(); }} placeholder="Escrever mensagem…" className="flex-1 min-w-0 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
            <button onClick={submit} className="px-4 py-2 rounded-lg text-sm font-medium text-white shrink-0" style={{ backgroundColor: C.oliveDark }}>Enviar</button>
          </div>
        </Card>
      )}
    </div>
  );
}
