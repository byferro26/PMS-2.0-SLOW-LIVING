function CashRegisterSection({ cashData, onOpen, onAddMovement, onClose }) {
  const [floatInput, setFloatInput] = useState("");
  const [movType, setMovType] = useState("entrada");
  const [movValue, setMovValue] = useState("");
  const [movDesc, setMovDesc] = useState("");
  const [countedInput, setCountedInput] = useState("");
  const session = cashData.current;
  const lastClosed = cashData.history[0];

  if (!session) {
    return (
      <div>
        {lastClosed && <p className="text-xs mb-3" style={{ color: C.inkSoft }}>Última sessão fechada por {lastClosed.closedBy}, diferença €{lastClosed.difference.toFixed(2)}.</p>}
        <Card className="p-5" style={{ maxWidth: 380 }}>
          <div className="text-sm font-semibold mb-3" style={{ color: C.ink }}>Abrir sessão de caixa</div>
          <Field label="Fundo inicial (€)"><input type="number" value={floatInput} onChange={(e) => setFloatInput(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm mb-3" style={inputStyle} /></Field>
          <button onClick={() => { onOpen(floatInput); setFloatInput(""); }} className="w-full py-2.5 rounded-full text-sm font-medium text-white" style={{ backgroundColor: C.oliveDark }}>Abrir sessão</button>
        </Card>
      </div>
    );
  }
  const entradas = session.movements.filter((m) => m.tipo === "entrada").reduce((s, m) => s + m.valor, 0);
  const saidas = session.movements.filter((m) => m.tipo === "saida").reduce((s, m) => s + m.valor, 0);
  const esperado = (session.startingFloat || 0) + entradas - saidas;
  return (
    <div className="grid grid-cols-2 gap-5">
      <div>
        <Card className="p-4 mb-4">
          <div className="flex justify-between text-xs mb-1" style={{ color: C.inkSoft }}><span>Fundo inicial</span><span>€{session.startingFloat.toFixed(2)}</span></div>
          <div className="flex justify-between text-xs mb-1" style={{ color: C.inkSoft }}><span>Entradas</span><span>€{entradas.toFixed(2)}</span></div>
          <div className="flex justify-between text-xs mb-1.5 pb-1.5 border-b" style={{ color: C.inkSoft, borderColor: C.line }}><span>Saídas</span><span>€{saidas.toFixed(2)}</span></div>
          <div className="flex justify-between text-sm font-semibold" style={{ color: C.ink }}><span>Esperado em caixa</span><span>€{esperado.toFixed(2)}</span></div>
        </Card>
        <Card className="p-4">
          <div className="text-sm font-semibold mb-2" style={{ color: C.ink }}>Fechar sessão</div>
          <Field label="Valor contado (€)"><input type="number" value={countedInput} onChange={(e) => setCountedInput(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm mb-3" style={inputStyle} /></Field>
          <button onClick={() => { onClose(countedInput); setCountedInput(""); }} className="w-full py-2.5 rounded-full text-sm font-medium text-white" style={{ backgroundColor: C.terracottaDark }}>Fechar sessão</button>
        </Card>
      </div>
      <div>
        <Card className="p-4 mb-4">
          <div className="text-sm font-semibold mb-2" style={{ color: C.ink }}>Novo movimento</div>
          <div className="flex gap-2 mb-2">
            <select value={movType} onChange={(e) => setMovType(e.target.value)} className="px-2 py-2 rounded-lg border text-sm" style={{ ...inputStyle, backgroundColor: "#fff" }}><option value="entrada">Entrada</option><option value="saida">Saída</option></select>
            <input type="number" placeholder="Valor €" value={movValue} onChange={(e) => setMovValue(e.target.value)} className="flex-1 min-w-0 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
          </div>
          <input placeholder="Descrição" value={movDesc} onChange={(e) => setMovDesc(e.target.value)} className="w-full mb-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
          <button disabled={!movValue} onClick={() => { onAddMovement({ tipo: movType, valor: movValue, desc: movDesc }); setMovValue(""); setMovDesc(""); }} style={{ backgroundColor: C.oliveDark, opacity: !movValue ? 0.5 : 1 }} className="w-full py-2 rounded-full text-xs font-medium text-white">Adicionar movimento</button>
        </Card>
        <div className="space-y-2">
          {session.movements.map((m) => <div key={m.id} className="text-xs flex justify-between pb-1.5 border-b" style={{ borderColor: C.line, color: C.inkSoft }}><span>{m.desc || "—"}</span><span style={{ color: m.tipo === "entrada" ? C.olive : C.terracotta }}>{m.tipo === "entrada" ? "+" : "−"}€{m.valor.toFixed(2)}</span></div>)}
          {session.movements.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem movimentos ainda.</p>}
        </div>
      </div>
    </div>
  );
}

function PreferencesPanel({ authUser, config, lang, onSave }) {
  const [language, setLanguage] = useState(authUser.language || "");
  const [appearance, setAppearance] = useState(authUser.appearance || "system");
  const [palette, setPalette] = useState(authUser.palette || "");
  const [notifPrefs, setNotifPrefs] = useState(authUser.notifPrefs || DEFAULT_NOTIF_PREFS);
  const [savedFlash, setSavedFlash] = useState(false);
  const catLabels = { pedidos: "Pedidos", mensagens: "Mensagens", tarefas: "Tarefas", alertas: "Alertas críticos" };

  function toggleNotif(cat, channel) {
    setNotifPrefs((p) => ({ ...p, [cat]: { ...p[cat], [channel]: !p[cat][channel] } }));
  }
  function save() {
    onSave({ language: language || null, appearance, palette: palette || null, notifPrefs });
    setSavedFlash(true); setTimeout(() => setSavedFlash(false), 2000);
  }

  return (
    <div style={{ maxWidth: 480 }}>
      <Card className="p-5 mb-4">
        <div className="text-sm font-semibold mb-1" style={{ color: C.ink }}>{t(lang, "prefs.language")}</div>
        <select value={language} onChange={(e) => setLanguage(e.target.value)} className="w-full px-2 py-2 rounded-lg border text-sm" style={{ ...inputStyle, backgroundColor: "#fff" }}>
          <option value="">Predefinido da organização ({LANGUAGE_OPTIONS[config.defaultLanguage]})</option>
          {config.availableLanguages.map((k) => <option key={k} value={k}>{LANGUAGE_OPTIONS[k]}</option>)}
        </select>
      </Card>
      <Card className="p-5 mb-4">
        <div className="text-sm font-semibold mb-2" style={{ color: C.ink }}>{t(lang, "prefs.appearance")}</div>
        <div className="flex gap-2 mb-4">
          {Object.entries(APPEARANCE_OPTIONS).map(([k, v]) => (
            <button key={k} onClick={() => setAppearance(k)} className="flex-1 py-2 rounded-lg text-xs font-medium border" style={appearance === k ? { backgroundColor: C.oliveDark, color: "#fff", borderColor: C.oliveDark } : { borderColor: C.line, color: C.inkSoft }}>{v}</button>
          ))}
        </div>
        <div className="text-sm font-semibold mb-2" style={{ color: C.ink }}>{t(lang, "prefs.palette")}</div>
        <div className="flex flex-wrap gap-1.5">
          <button onClick={() => setPalette("")} className="text-xs px-2.5 py-1 rounded-full border" style={!palette ? { backgroundColor: C.oliveDark, color: "#fff", borderColor: C.oliveDark } : { borderColor: C.line, color: C.inkSoft }}>Predefinido</button>
          {config.availablePalettes.map((k) => (
            <button key={k} onClick={() => setPalette(k)} className="text-xs px-2.5 py-1 rounded-full border" style={palette === k ? { backgroundColor: C.oliveDark, color: "#fff", borderColor: C.oliveDark } : { borderColor: C.line, color: C.inkSoft }}>{PALETTE_OPTIONS[k]}</button>
          ))}
        </div>
      </Card>
      <Card className="p-5 mb-4">
        <div className="text-sm font-semibold mb-3" style={{ color: C.ink }}>{t(lang, "prefs.notifications")}</div>
        <div className="space-y-3">
          {Object.keys(notifPrefs).map((cat) => (
            <div key={cat} className="flex items-center justify-between">
              <span className="text-xs" style={{ color: C.ink }}>{catLabels[cat]}</span>
              <div className="flex gap-3">
                <label className="flex items-center gap-1 text-xs" style={{ color: C.inkSoft }}><input type="checkbox" checked={notifPrefs[cat].inapp} onChange={() => toggleNotif(cat, "inapp")} /> In-app</label>
                <label className="flex items-center gap-1 text-xs" style={{ color: C.inkSoft }}><input type="checkbox" checked={notifPrefs[cat].email} onChange={() => toggleNotif(cat, "email")} /> Email</label>
              </div>
            </div>
          ))}
        </div>
      </Card>
      <button onClick={save} className="py-2.5 px-5 rounded-full text-sm font-medium text-white" style={{ backgroundColor: C.oliveDark }}>{t(lang, "action.save")}</button>
      {savedFlash && <span className="text-xs ml-3" style={{ color: C.olive }}>{t(lang, "prefs.saved")}</span>}
    </div>
  );
}

function ConciergeSection({ concierge, onSave }) {
  const [placeName, setPlaceName] = useState(""); const [placeCat, setPlaceCat] = useState("");
  const [actName, setActName] = useState(""); const [actTime, setActTime] = useState(""); const [actSpots, setActSpots] = useState(""); const [actPrice, setActPrice] = useState("");
  const [ruleText, setRuleText] = useState("");

  function addPlace() { if (!placeName) return; onSave({ ...concierge, places: [...concierge.places, { id: `cp-${Date.now()}`, name: placeName, cat: placeCat }] }); setPlaceName(""); setPlaceCat(""); }
  function removePlace(id) { onSave({ ...concierge, places: concierge.places.filter((p) => p.id !== id) }); }
  function addActivity() { if (!actName) return; onSave({ ...concierge, activities: [...concierge.activities, { id: `ca-${Date.now()}`, name: actName, time: actTime, spots: actSpots, price: Number(actPrice) || 0 }] }); setActName(""); setActTime(""); setActSpots(""); setActPrice(""); }
  function removeActivity(id) { onSave({ ...concierge, activities: concierge.activities.filter((a) => a.id !== id) }); }
  function addRule() { if (!ruleText) return; onSave({ ...concierge, rules: [...concierge.rules, ruleText] }); setRuleText(""); }
  function removeRule(idx) { onSave({ ...concierge, rules: concierge.rules.filter((_, i) => i !== idx) }); }

  return (
    <div className="grid grid-cols-3 gap-5">
      <div>
        <div className="text-sm font-semibold mb-2" style={{ color: C.ink }}>Mapa Local & Concierge</div>
        <div className="space-y-2 mb-3">
          {concierge.places.map((p) => (
            <Card key={p.id} className="p-3 flex justify-between items-center"><div><div className="text-xs font-medium" style={{ color: C.ink }}>{p.name}</div><div className="text-xs" style={{ color: C.inkSoft }}>{p.cat}</div></div><button onClick={() => removePlace(p.id)} className="p-1 rounded-full" style={{ color: C.terracotta }}><X size={13} /></button></Card>
          ))}
          {concierge.places.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem locais.</p>}
        </div>
        <input placeholder="Nome do local" value={placeName} onChange={(e) => setPlaceName(e.target.value)} className="w-full mb-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
        <input placeholder="Categoria" value={placeCat} onChange={(e) => setPlaceCat(e.target.value)} className="w-full mb-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
        <button disabled={!placeName} onClick={addPlace} style={{ backgroundColor: C.oliveDark, opacity: !placeName ? 0.5 : 1 }} className="w-full py-2 rounded-full text-xs font-medium text-white">+ Adicionar local</button>
      </div>
      <div>
        <div className="text-sm font-semibold mb-2" style={{ color: C.ink }}>Atividades & Experiências</div>
        <div className="space-y-2 mb-3">
          {concierge.activities.map((a) => (
            <Card key={a.id} className="p-3 flex justify-between items-center"><div><div className="text-xs font-medium" style={{ color: C.ink }}>{a.name}</div><div className="text-xs" style={{ color: C.inkSoft }}>{a.time} · {a.spots}{a.price ? ` · €${a.price}` : ""}</div></div><button onClick={() => removeActivity(a.id)} className="p-1 rounded-full" style={{ color: C.terracotta }}><X size={13} /></button></Card>
          ))}
          {concierge.activities.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem atividades.</p>}
        </div>
        <input placeholder="Nome da atividade" value={actName} onChange={(e) => setActName(e.target.value)} className="w-full mb-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
        <div className="grid grid-cols-3 gap-2 mb-2">
          <input placeholder="Horário" value={actTime} onChange={(e) => setActTime(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
          <input placeholder="Lugares" value={actSpots} onChange={(e) => setActSpots(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
          <input placeholder="€" type="number" value={actPrice} onChange={(e) => setActPrice(e.target.value)} className="w-full px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
        </div>
        <p className="text-xs mb-2" style={{ color: C.inkSoft }}>Se tiver preço, a reserva feita pelo hóspede soma-se automaticamente à conta.</p>
        <button disabled={!actName} onClick={addActivity} style={{ backgroundColor: C.oliveDark, opacity: !actName ? 0.5 : 1 }} className="w-full py-2 rounded-full text-xs font-medium text-white">+ Adicionar atividade</button>
      </div>
      <div>
        <div className="text-sm font-semibold mb-2" style={{ color: C.ink }}>Regras da casa</div>
        <div className="space-y-2 mb-3">
          {concierge.rules.map((r, i) => <div key={i} className="flex justify-between items-center text-xs pb-1.5 border-b" style={{ borderColor: C.line, color: C.inkSoft }}><span>{r}</span><button onClick={() => removeRule(i)} className="p-1 rounded-full" style={{ color: C.terracotta }}><X size={12} /></button></div>)}
          {concierge.rules.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem regras.</p>}
        </div>
        <input placeholder="Nova regra" value={ruleText} onChange={(e) => setRuleText(e.target.value)} className="w-full mb-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
        <button disabled={!ruleText} onClick={addRule} style={{ backgroundColor: C.oliveDark, opacity: !ruleText ? 0.5 : 1 }} className="w-full py-2 rounded-full text-xs font-medium text-white">+ Adicionar regra</button>
      </div>
    </div>
  );
}

                  <button disabled={booked || !reservation} onClick={() => { onBookActivity(reservation, unit, a); setBookedIds((ids) => [...ids, a.id]); }} className="text-xs font-medium px-3 py-1.5 rounded-full text-white flex items-center gap-1" style={{ backgroundColor: booked ? C.olive : C.clay, opacity: !reservation ? 0.5 : 1 }}>{booked ? <><Check size={12} /> Reservado</> : "Reservar"}</button>
                </div>
                {a.price > 0 && !booked && <p className="text-xs mt-1" style={{ color: C.inkSoft }}>Fica automaticamente adicionado à conta da reserva.</p>}
              </Card>
            );
          })}
          {concierge.activities.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem atividades disponíveis por agora.</p>}
        </div>
      </div>
    );
  }

  if (screen === "services") {
    return (
      <div>
        <Header title="Serviços & Regras da Casa" />
        <div className="px-5 pb-4">
          <div className="flex items-center gap-2 mb-3 text-sm" style={{ color: C.ink }}><Wifi size={16} color={C.olive} /> Wi-Fi: <span className="font-medium">SlowLiving-Safara</span></div>
          <Card className="p-4"><div className="flex items-center gap-2 mb-3"><ShieldCheck size={16} color={C.oliveDark} /><span className="text-sm font-medium" style={{ color: C.ink }}>Regras da casa</span></div><ul className="space-y-2">{concierge.rules.map((r, i) => <li key={i} className="text-xs" style={{ color: C.inkSoft }}>· {r}</li>)}</ul></Card>
        </div>
      </div>
    );
  }

  if (screen === "conta") {
    const subtotal = reservation ? reservationSubtotal(reservation) : 0;
    const ivaAmount = subtotal * (ivaRate / 100);
    const touristTax = reservation ? reservationTouristTax(reservation, config) : 0;
    const total = reservation ? reservationTotal(reservation, ivaRate, config) : 0;
    const pago = reservation ? reservationPago(reservation) : 0;
    const saldo = reservation ? reservationSaldo(reservation, ivaRate, config) : 0;
    return (
      <div>
        <Header title="Conta Corrente" />
        <div className="px-5 pb-4">
          {!reservation ? (
            <Card className="p-6 text-center"><p className="text-sm" style={{ color: C.inkSoft }}>Sem estadia ativa.</p></Card>
          ) : (
            <>
              <Card className="p-4 mb-3">
                <div className="text-xs mb-1" style={{ color: C.inkSoft }}>Reserva {reservation.numero}</div>
                <div className="text-xs flex justify-between mb-1.5 pb-1.5 border-b" style={{ color: C.inkSoft, borderColor: C.line }}><span>Estadia</span><span>€{reservation.value.toFixed(2)}</span></div>
                {(reservation.extras || []).length === 0 && <p className="text-xs mb-1.5" style={{ color: C.inkSoft }}>Sem consumos adicionais.</p>}
                {(reservation.extras || []).map((e) => (
                  <div key={e.id} className="text-xs flex items-center justify-between mb-1" style={{ color: C.inkSoft }}>
                    <span>{e.name}{e.qty > 1 ? ` × ${e.qty}` : ""}</span>
                    <span className="flex items-center gap-1.5">€{(e.price * e.qty).toFixed(2)}{e.status === "pending" && <Pill color={C.clay}>Aguarda aprovação</Pill>}</span>
                  </div>
                ))}
                <div className="text-xs flex justify-between mt-2 pt-2 border-t" style={{ color: C.inkSoft, borderColor: C.line }}><span>IVA ({ivaRate}%)</span><span>€{ivaAmount.toFixed(2)}</span></div>
                {touristTax > 0 && <div className="text-xs flex justify-between mt-1" style={{ color: C.inkSoft }}><span>Taxa turística</span><span>€{touristTax.toFixed(2)}</span></div>}
                <div className="text-sm flex justify-between mt-1 font-semibold" style={{ color: C.ink }}><span>Total</span><span>€{total.toFixed(2)}</span></div>
                <div className="text-xs flex justify-between mt-1" style={{ color: C.inkSoft }}><span>Pago</span><span>€{pago.toFixed(2)}</span></div>
                <div className="text-sm flex justify-between mt-1 font-semibold" style={{ color: saldo > 0.01 ? C.terracotta : C.ink }}><span>Pendente a pagar</span><span>€{saldo.toFixed(2)}</span></div>
              </Card>
              <p className="text-xs" style={{ color: C.inkSoft }}>Itens marcados "Aguarda aprovação" ainda estão a ser confirmados pela receção.</p>
            </>
          )}
        </div>
      </div>
    );
  }

  if (screen === "chat") {
    function submitChat() { if (!chatText.trim() || !reservation) return; onSendMessage({ reservationId: reservation.id, unitId: unit.id, sender: "guest", text: chatText }); setChatText(""); }
    return (
      <div className="flex flex-col" style={{ height: "100%" }}>
        <Header title="Chat com a Receção" />
        <div className="px-5 pb-4 flex-1 flex flex-col min-h-0">
          {!reservation ? (
            <Card className="p-6 text-center"><p className="text-sm" style={{ color: C.inkSoft }}>Sem estadia ativa.</p></Card>
          ) : (
            <>
              <p className="text-xs mb-2" style={{ color: C.inkSoft }}>Conversa individual de {gName} · {unit.name}</p>
              <div className="flex-1 overflow-y-auto space-y-2 mb-3">
                {unitMessages.map((m) => (
                  <div key={m.id} className={`flex ${m.sender === "guest" ? "justify-end" : "justify-start"}`}>
                    <div className="rounded-2xl px-3 py-2 text-xs" style={{ maxWidth: "80%", backgroundColor: m.sender === "guest" ? C.terracotta : C.card, color: m.sender === "guest" ? "#fff" : C.ink, border: m.sender === "guest" ? "none" : `1px solid ${C.line}` }}>{m.text}</div>
                  </div>
                ))}
                {unitMessages.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Envie uma mensagem à receção — só a receção vê esta conversa.</p>}
              </div>
              <div className="flex gap-2">
                <input value={chatText} onChange={(e) => setChatText(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") submitChat(); }} placeholder="Escrever…" className="flex-1 min-w-0 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
                <button onClick={submitChat} className="px-4 py-2 rounded-lg text-sm font-medium text-white shrink-0" style={{ backgroundColor: C.oliveDark }}>Enviar</button>
              </div>
            </>
          )}
        </div>
      </div>
    );
  }

  if (screen === "maintReq") {
    function submitMaint() { onMaintenanceRequest(reservation, unit, maintDesc.trim()); setMaintSent(true); }
    return (
      <div>
        <Header title="Pedido de Manutenção" />
        <div className="px-5 pb-4">
          {!reservation ? (
            <Card className="p-6 text-center"><p className="text-sm" style={{ color: C.inkSoft }}>Sem estadia ativa.</p></Card>
          ) : maintSent ? (
            <Card className="p-6 flex flex-col items-center text-center">
              <div className="rounded-full p-3 mb-3" style={{ backgroundColor: C.olive + "22" }}><Check size={24} color={C.oliveDark} /></div>
              <p className="text-sm font-medium" style={{ color: C.ink }}>Pedido enviado</p>
              <p className="text-xs mt-1" style={{ color: C.inkSoft }}>A receção foi notificada e vai acompanhar aqui o estado do pedido.</p>
            </Card>
          ) : (
            <>
              <p className="text-xs mb-3" style={{ color: C.inkSoft }}>Descreve brevemente o que se passa.</p>
              <textarea value={maintDesc} onChange={(e) => setMaintDesc(e.target.value)} rows={4} placeholder="Ex: torneira da casa de banho a pingar" className="w-full mb-3 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
              <button onClick={submitMaint} className="w-full py-2.5 rounded-full text-white text-sm font-medium" style={{ backgroundColor: C.oliveDark }}>Enviar pedido</button>
            </>
          )}
        </div>
      </div>
    );
  }

  if (screen === "notifications") {
    const myRequests = reservation ? requestsData.filter((r) => r.resId === reservation.id) : [];
    const myBookingIds = reservation ? tableBookingsData.filter((b) => b.reservationId === reservation.id).map((b) => b.id) : [];
    const myOrders = reservation ? ordersData.filter((o) => myBookingIds.includes(o.tableBookingId)) : [];
    return (
      <div>
        <Header title="Notificações" />
        <div className="px-5 pb-4">
          {!reservation ? (
            <Card className="p-6 text-center"><p className="text-sm" style={{ color: C.inkSoft }}>Sem estadia ativa.</p></Card>
          ) : (
            <>
              <div className="text-xs font-semibold mb-2" style={{ color: C.ink }}>Os teus pedidos</div>
              <div className="space-y-2 mb-4">
                {myRequests.map((r) => {
                  const meta = r.status ? requestStatusMeta(r.status) : { label: r.done ? "Concluído" : "Pendente", color: r.done ? C.olive : C.clay };
                  return (
                    <Card key={r.id} className="p-3">
                      <div className="flex items-center justify-between gap-2">
                        <span className="text-xs" style={{ color: C.ink }}>{r.text}</span>
                        <Pill color={meta.color}>{meta.label}</Pill>
                      </div>
                    </Card>
                  );
                })}
                {myRequests.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem pedidos ainda.</p>}
              </div>
              <div className="text-xs font-semibold mb-2" style={{ color: C.ink }}>Restaurante</div>
              <div className="space-y-2">
                {myOrders.map((o) => {
                  const meta = orderStatusMeta(o.status);
                  return (
                    <Card key={o.id} className="p-3">
                      <div className="flex items-center justify-between gap-2 mb-1"><span className="text-xs font-medium" style={{ color: C.ink }}>{o.numero}</span><Pill color={meta.color}>{meta.label}</Pill></div>
                      <div className="text-xs" style={{ color: C.inkSoft }}>{o.items.map((i) => `${i.name} ×${i.qty}`).join(", ")}</div>
                    </Card>
                  );
                })}
                {myOrders.length === 0 && <p className="text-xs" style={{ color: C.inkSoft }}>Sem pedidos ao restaurante.</p>}
              </div>
            </>
          )}
        </div>
      </div>
    );
  }

  if (screen === "checkout") {
    function submit() {
      setCoError("");
      const result = onCheckoutAuth(reservation, coUser, coPass);
      if (result.ok) setCoSuccess(result); else setCoError(result.error);
    }
    return (
      <div>
        <Header title="Checkout" />
        <div className="px-5 pb-4">
          {!reservation ? (
            <Card className="p-6 text-center"><p className="text-sm" style={{ color: C.inkSoft }}>Sem estadia ativa para fazer checkout.</p></Card>
          ) : coSuccess ? (
            <Card className="p-6 flex flex-col items-center text-center">
              <div className="rounded-full p-3 mb-3" style={{ backgroundColor: C.olive + "22" }}><Check size={24} color={C.oliveDark} /></div>
              <p className="text-sm font-medium mb-1" style={{ color: C.ink }}>Checkout concluído</p>
              <p className="text-xs mb-1" style={{ color: C.inkSoft }}>Reserva {reservation.numero} · confirmado por {coSuccess.staffName}.</p>
              <p className="text-xs" style={{ color: C.inkSoft }}>Obrigado pela estadia. Deixe o smartphone na base de carregamento junto à entrada.</p>
            </Card>
          ) : (
            <>
              <Card className="p-4 mb-3">
                <div className="text-sm mb-1" style={{ color: C.ink }}>Resumo da estadia — Reserva {reservation.numero}</div>
                <div className="text-xs" style={{ color: C.inkSoft }}>{fmtShort(reservation.checkin)} — {fmtShort(reservation.checkout)} · {unit.name}, {unit.place}</div>
                <div className="flex items-center justify-between mt-3 pt-3 border-t" style={{ borderColor: C.line }}><span className="text-sm" style={{ color: C.ink }}>Saldo</span><span className="text-sm font-semibold" style={{ color: C.terracotta }}>€ {reservationSaldo(reservation, ivaRate, config).toFixed(2)}</span></div>
              </Card>
              <Card className="p-4 mb-3">
                <div className="flex items-center gap-1.5 mb-1 text-sm font-medium" style={{ color: C.ink }}><Lock size={14} /> Confirmação pela receção</div>
                <p className="text-xs mb-3" style={{ color: C.inkSoft }}>O checkout é confirmado por um colaborador. Peça a alguém da receção para se autenticar aqui.</p>
                <input value={coUser} onChange={(e) => setCoUser(e.target.value)} placeholder="Utilizador" className="w-full mb-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
                <input type="password" value={coPass} onChange={(e) => setCoPass(e.target.value)} placeholder="Password" className="w-full mb-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle} onKeyDown={(e) => { if (e.key === "Enter") submit(); }} />
                {coError && <p className="text-xs mb-2" style={{ color: C.terracotta }}>{coError}</p>}
                <button onClick={submit} className="w-full py-2.5 rounded-full text-white text-sm font-medium" style={{ backgroundColor: C.oliveDark }}>Autenticar e confirmar checkout</button>
              </Card>
              <p className="text-xs text-center" style={{ color: C.inkSoft }}>Deixe o smartphone na base de carregamento junto à entrada.</p>
            </>
          )}
        </div>
      </div>
    );
  }
  return null;
}

function buildNavGroups(user, departmentsData, lang) {
  const dept = departmentsData.find((d) => d.id === user.departmentId);
  const groups = [];
  groups.push({ label: null, items: [{ key: "painel", label: t(lang, "nav.painel"), icon: TrendingUp }] });
  const commItems = [{ key: "equipa", label: t(lang, "nav.equipa"), icon: MessageCircle }];
  if (canAccessModule(user, "mensagens", departmentsData)) commItems.push({ key: "mensagens", label: t(lang, "nav.mensagens"), icon: MODULE_CATALOG.mensagens.icon });
  groups.push({ label: t(lang, "group.comunicacao"), items: commItems });
  const opKeys = Object.keys(MODULE_CATALOG).filter((k) => k !== "mensagens" && k !== "concierge" && k !== "dispositivos" && canAccessModule(user, k, departmentsData));
  if (opKeys.length) groups.push({ label: user.role === "admin" ? "Operações" : (dept ? dept.name : "Operações"), items: opKeys.map((k) => ({ key: k, label: t(lang, `nav.${k}`), icon: MODULE_CATALOG[k].icon })) });
  const guestExp = ["concierge", "dispositivos"].filter((k) => canAccessModule(user, k, departmentsData));
  if (guestExp.length) groups.push({ label: t(lang, "group.guestexp"), items: guestExp.map((k) => ({ key: k, label: t(lang, `nav.${k}`), icon: MODULE_CATALOG[k].icon })) });
  const adminKeys = Object.keys(ADMIN_CATALOG).filter((k) => canAccessAdmin(user, k));
  if (adminKeys.length) groups.push({ label: t(lang, "group.admin"), items: adminKeys.map((k) => ({ key: k, label: t(lang, `nav.${k}`), icon: ADMIN_CATALOG[k].icon })) });
  groups.push({ label: null, items: [{ key: "perfil", label: t(lang, "nav.perfil"), icon: UserCog }] });
  return groups;
}

function GlobalSearch({ authUser, departmentsData, reservationsData, guestsData, unitsData, onOpenReservation, onOpenGuest, onGoTo }) {
  const [query, setQuery] = useState("");
  const [open, setOpen] = useState(false);
  const q = query.trim().toLowerCase();
  let results = [];
  if (q) {
    if (canAccessModule(authUser, "reservas", departmentsData)) {
      reservationsData.filter((r) => r.status !== "cancelled").forEach((r) => {
        const gname = reservationGuestSummary(r, guestsData).toLowerCase();
        const unitNm = (unitsData.find((u) => u.id === r.unitId)?.name || "").toLowerCase();
        if (r.numero.toLowerCase().includes(q) || gname.includes(q) || unitNm.includes(q)) {
          results.push({ kind: "reservation", id: r.id, label: `${r.numero} · ${reservationGuestSummary(r, guestsData)}`, sub: `${unitsData.find((u) => u.id === r.unitId)?.name || ""} · ${fmtShort(r.checkin)}–${fmtShort(r.checkout)}` });
        }
      });
    }
    if (canAccessModule(authUser, "hospedes", departmentsData)) {
      guestsData.filter((g) => g.name.toLowerCase().includes(q)).forEach((g) => results.push({ kind: "guest", id: g.id, label: g.name, sub: "Hóspede" }));
    }
    if (canAccessModule(authUser, "unidades", departmentsData)) {
      unitsData.filter((u) => u.name.toLowerCase().includes(q)).forEach((u) => results.push({ kind: "unit", id: u.id, label: u.name, sub: u.place }));
    }
    results = results.slice(0, 8);
  }
  function handlePick(r) {
    setOpen(false); setQuery("");
    if (r.kind === "reservation") onOpenReservation(r.id);
    else if (r.kind === "guest") onOpenGuest(r.id);
    else onGoTo("unidades");
  }
  return (
    <div className="relative mb-4">
      <div className="flex items-center gap-2 px-3 py-2 rounded-lg" style={{ backgroundColor: "rgba(239,231,214,0.08)" }}>
        <SearchIcon size={13} color={C.sidebarSoft} />
        <input value={query} onChange={(e) => { setQuery(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} placeholder="Pesquisar…" className="bg-transparent border-none outline-none text-xs flex-1 min-w-0" style={{ color: C.sidebarText }} />
      </div>
      {open && q && (
        <div className="absolute z-20 mt-1 rounded-lg overflow-hidden shadow-xl" style={{ backgroundColor: C.card, border: `1px solid ${C.line}`, width: 260 }}>
          {results.length === 0 && <div className="px-3 py-2 text-xs" style={{ color: C.inkSoft }}>Sem resultados.</div>}
          {results.map((r, i) => (
            <button key={i} onClick={() => handlePick(r)} className="w-full text-left px-3 py-2 text-xs border-b" style={{ borderColor: C.line, color: C.ink }}>
              <div className="font-medium">{r.label}</div>
              <div style={{ color: C.inkSoft }}>{r.sub}</div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

        <div className="flex items-center gap-2.5 mb-1">
          <div className="rounded-lg flex items-center justify-center shrink-0" style={{ width: 34, height: 34, backgroundColor: "var(--brand)" }}><TreePine size={16} color="#F7EEE2" /></div>
          <div><div style={{ fontFamily: "var(--font-ui)", fontWeight: 700, color: C.sidebarText }} className="text-sm leading-tight">Slow Living</div><div style={{ fontFamily: "var(--font-mono)", color: C.sidebarSoft, letterSpacing: "0.08em" }} className="text-xs">ALENTEJO</div></div>
        </div>
        <div style={{ width: 24, height: 2, backgroundColor: "var(--signal)", opacity: 0.7, marginBottom: 16 }} />

              {g.label && <div className="text-xs uppercase tracking-wide mt-4 mb-1 px-3" style={{ color: "#8A7F6C" }}>{g.label}</div>}
              {g.items.map((it) => <NavBtn key={it.key} it={it} />)}
            </React.Fragment>
          ))}
        </nav>
        <div className="mt-auto pt-4" style={{ borderTop: "1px solid rgba(243,234,218,0.1)" }}>
          <div className="rounded-lg p-2.5 mb-2" style={{ backgroundColor: "rgba(243,234,218,0.05)" }}>
            <div className="text-xs font-medium" style={{ color: C.sidebarText }}>{authUser.name}</div>
            <div className="flex items-center gap-1 mt-1 flex-wrap">
              <span className="px-2 py-0.5 rounded-full text-xs" style={{ backgroundColor: "var(--brand)", color: "#fff" }}>{ROLE_LABELS[authUser.role]}</span>
              {dept && <span className="px-2 py-0.5 rounded-full text-xs" style={{ backgroundColor: "rgba(243,234,218,0.1)", color: C.sidebarText }}>{dept.name}</span>}
            </div>
          </div>
          <button onClick={onLogout} className="w-full py-2 rounded-lg text-xs" style={{ backgroundColor: "rgba(243,234,218,0.07)", color: C.sidebarText }}>{t(lang, "action.sair")}</button>
          <div className="text-center mt-3" style={{ fontFamily: "var(--font-mono)", fontSize: 10, letterSpacing: "0.1em", color: C.sidebarSoft, opacity: 0.6 }}>by FERRO</div>
        </div>
      </div>
      <div className="flex-1 min-w-0 p-8">{children}</div>
    </div>
  );
}

    const u = usersData.find((u) => u.username === username && u.password === password);

    <div className="min-h-screen w-full flex flex-col items-center justify-center p-6 sl-grid" style={{ backgroundColor: C.bg }}>
      <div className="w-full" style={{ maxWidth: 340 }}>
        <div className="text-center mb-6">
          <div className="inline-flex items-center justify-center rounded-lg mb-3" style={{ width: 40, height: 40, backgroundColor: "var(--brand)" }}><TreePine size={18} color="#F7EEE2" /></div>
          <h1 style={{ fontFamily: "var(--font-ui)", fontWeight: 700, color: C.ink }} className="text-xl">{t(lang, "login.title")}</h1>
          <div style={{ width: 28, height: 2, backgroundColor: "var(--signal)", opacity: 0.8, margin: "8px auto" }} />
          <p style={{ fontFamily: "var(--font-mono)", letterSpacing: "0.08em", color: C.inkSoft }} className="text-xs mt-1">{t(lang, "login.subtitle")}</p>

/* Kiosk setup — receptionist authenticates, picks unit + reservation      */
/* ---------------------------------------------------------------------- */

function KioskSetupFlow({ usersData, unitsData, reservationsData, guestsData, departmentsData, todayStr, onConfirmCheckin, onEnterExisting, onCancel }) {
  const [step, setStep] = useState("login");
  const [staffUser, setStaffUser] = useState(null);
  const [username, setUsername] = useState(""); const [password, setPassword] = useState(""); const [error, setError] = useState("");
  const [selectedUnitId, setSelectedUnitId] = useState(null);

  function submitLogin() {
    const u = usersData.find((u) => u.username === username && u.password === password && isFrontOffice(u, departmentsData));
    if (!u) { setError("Credenciais inválidas ou sem permissão de receção."); return; }
    setStaffUser(u); setStep("unit"); setError("");
  }

  if (step === "login") {
    return (
      <div className="min-h-screen w-full flex items-center justify-center p-6" style={{ backgroundColor: C.bg }}>
        <Card className="p-6 w-full" style={{ maxWidth: 340 }}>
          <div className="flex items-center gap-1.5 mb-3"><Lock size={14} color={C.inkSoft} /><span className="text-sm font-semibold" style={{ color: C.ink }}>Check-in de Unidade</span></div>
          <p className="text-xs mb-3" style={{ color: C.inkSoft }}>Autentica-te para configurar o smartphone de um hóspede.</p>
          <input value={username} onChange={(e) => setUsername(e.target.value)} placeholder="Utilizador" className="w-full mb-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
          <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") submitLogin(); }} placeholder="Password" className="w-full mb-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
          {error && <p className="text-xs mb-2" style={{ color: C.terracotta }}>{error}</p>}
          <button onClick={submitLogin} className="w-full py-2.5 rounded-full text-sm font-medium text-white mb-2" style={{ backgroundColor: C.oliveDark }}>Continuar</button>
          <button onClick={onCancel} className="w-full py-2 text-xs" style={{ color: C.inkSoft }}>Cancelar</button>
        </Card>
      </div>
    );
  }

  if (step === "unit") {
    const alUnits = unitsData.filter((u) => u.type === "Alojamento Local");
    return (
      <div className="min-h-screen w-full flex items-center justify-center p-6" style={{ backgroundColor: C.bg }}>
        <Card className="p-6 w-full" style={{ maxWidth: 340 }}>
          <div className="text-sm font-semibold mb-3" style={{ color: C.ink }}>Escolhe a unidade</div>
          <div className="space-y-2 mb-3">
            {alUnits.map((u) => {
              const current = currentReservationFor(u.id, reservationsData, todayStr);
              return (
                <button key={u.id} onClick={() => { setSelectedUnitId(u.id); setStep("reservation"); }} className="w-full p-3 rounded-xl border text-left" style={{ borderColor: C.line }}>
                  <div className="text-sm font-medium" style={{ color: C.ink }}>{u.name}</div>
                  <div className="text-xs" style={{ color: C.inkSoft }}>{current ? `Em estadia — ${guestName(current.ownerGuestId, guestsData)}` : u.place}</div>
                </button>
              );
            })}
          </div>
          <button onClick={onCancel} className="w-full py-2 text-xs" style={{ color: C.inkSoft }}>Cancelar</button>
        </Card>
      </div>
    );
  }

  const unit = unitsData.find((u) => u.id === selectedUnitId);
  const current = currentReservationFor(selectedUnitId, reservationsData, todayStr);
  const pending = reservationsData.filter((r) => r.unitId === selectedUnitId && r.status === "confirmed").sort((a, b) => a.checkin.localeCompare(b.checkin));
  return (
    <div className="min-h-screen w-full flex items-center justify-center p-6" style={{ backgroundColor: C.bg }}>
      <Card className="p-6 w-full" style={{ maxWidth: 360 }}>
        <div className="text-sm font-semibold mb-1" style={{ color: C.ink }}>{unit?.name}</div>
        {current ? (
          <>
            <p className="text-xs mb-3" style={{ color: C.inkSoft }}>Já em check-in: <strong style={{ color: C.ink }}>{guestName(current.ownerGuestId, guestsData)}</strong> · Reserva {current.numero}.</p>
            <button onClick={() => onEnterExisting(selectedUnitId)} className="w-full py-2.5 rounded-full text-sm font-medium text-white mb-2" style={{ backgroundColor: C.oliveDark }}>Entregar smartphone</button>
          </>
        ) : (
          <>
            <p className="text-xs mb-3" style={{ color: C.inkSoft }}>Escolhe a reserva para fazer o check-in.</p>
            <div className="space-y-2 mb-3">
              {pending.map((r) => (
                <button key={r.id} onClick={() => onConfirmCheckin(r, staffUser)} className="w-full p-3 rounded-xl border text-left" style={{ borderColor: C.line }}>
                  <div className="text-sm font-medium" style={{ color: C.ink }}>{r.numero} · {guestName(r.ownerGuestId, guestsData)}</div>
                  <div className="text-xs" style={{ color: C.inkSoft }}>{fmtShort(r.checkin)} – {fmtShort(r.checkout)}</div>
                </button>
              ))}
              {pending.length === 0 && <p className="text-xs mb-2" style={{ color: C.inkSoft }}>Sem reservas confirmadas para esta unidade.</p>}
            </div>
          </>
        )}
        <button onClick={() => setStep("unit")} className="w-full py-2 text-xs mb-1" style={{ color: C.inkSoft }}>Voltar</button>
        <button onClick={onCancel} className="w-full py-2 text-xs" style={{ color: C.inkSoft }}>Cancelar</button>
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Storage helpers (per-browser, synchronous)                             */
/* ---------------------------------------------------------------------- */

function loadKey(key, fallback) {
  try { const raw = localStorage.getItem(key); if (raw) return JSON.parse(raw); } catch (e) {}
  try { localStorage.setItem(key, JSON.stringify(fallback)); } catch (e) {}
  return fallback;
}
function saveKey(key, data) { try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) { console.error("save failed", e); } }

/* ---------------------------------------------------------------------- */
/* Root                                                                    */
/* ---------------------------------------------------------------------- */

function SlowLivingPMS() {
  const [authUser, setAuthUser] = useState(null);
  const [guestMode, setGuestMode] = useState(false);
  const [guestUnitId, setGuestUnitId] = useState(null);
  const [kioskFlow, setKioskFlow] = useState(false);
  const [exitAuthOpen, setExitAuthOpen] = useState(false);
  const [exitUser, setExitUser] = useState(""); const [exitPass, setExitPass] = useState(""); const [exitError, setExitError] = useState("");
  const [section, setSection] = useState("painel");
  const [focusReservationId, setFocusReservationId] = useState(null);
  const [focusGuestId, setFocusGuestId] = useState(null);
  const [todayDate] = useState(() => new Date());
  const todayStr = isoDate(todayDate);

  const [unitsData, setUnitsData] = useState(() => loadKey(STORAGE_KEYS.units, defaultUnits));
  const [reservationsData, setReservationsData] = useState(() => loadKey(STORAGE_KEYS.reservations, buildDefaultReservations(todayDate)));
  const [tasksData, setTasksData] = useState(() => loadKey(STORAGE_KEYS.tasks, defaultTasks));
  const [requestsData, setRequestsData] = useState(() => loadKey(STORAGE_KEYS.requests, defaultRequests));
  const [guestsData, setGuestsData] = useState(() => loadKey(STORAGE_KEYS.guests, defaultGuests));
  const [usersData, setUsersData] = useState(() => loadKey(STORAGE_KEYS.users, defaultUsers));
  const [maintenanceData, setMaintenanceData] = useState(() => loadKey(STORAGE_KEYS.maintenance, defaultMaintenance));
  const [productsData, setProductsData] = useState(() => loadKey(STORAGE_KEYS.products, defaultProducts));
  const [cashData, setCashData] = useState(() => loadKey(STORAGE_KEYS.cash, defaultCash));
  const [logData, setLogData] = useState(() => loadKey(STORAGE_KEYS.log, defaultLog));
  const [config, setConfig] = useState(() => loadKey(STORAGE_KEYS.config, defaultConfig));
  const lang = authUser?.language || config.defaultLanguage || "pt";

  useEffect(() => {
    const appearance = authUser?.appearance || config.defaultAppearance || "system";
    if (appearance === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", appearance);
  }, [authUser?.appearance, config.defaultAppearance]);

  useEffect(() => {
    const palette = authUser?.palette || config.defaultPalette || "terracotta";
    document.documentElement.setAttribute("data-palette", palette);
  }, [authUser?.palette, config.defaultPalette]);

  useEffect(() => {
    if (!authUser) return;
    const timeoutMs = Math.max(1, config.sessionTimeoutMinutes || 30) * 60 * 1000;
    let timer = setTimeout(() => setAuthUser(null), timeoutMs);
    function reset() { clearTimeout(timer); timer = setTimeout(() => setAuthUser(null), timeoutMs); }
    const events = ["mousedown", "keydown", "touchstart"];
    events.forEach((ev) => window.addEventListener(ev, reset));
    return () => { clearTimeout(timer); events.forEach((ev) => window.removeEventListener(ev, reset)); };
  }, [authUser?.id, config.sessionTimeoutMinutes]);

  const [ordersData, setOrdersData] = useState(() => loadKey(STORAGE_KEYS.orders, defaultOrders));
  const [concierge, setConcierge] = useState(() => loadKey(STORAGE_KEYS.concierge, defaultConcierge));
  const [messagesData, setMessagesData] = useState(() => loadKey(STORAGE_KEYS.messages, defaultMessages));
  const [teamMessagesData, setTeamMessagesData] = useState(() => loadKey(STORAGE_KEYS.teamMessages, defaultTeamMessages));
  const [tablesData, setTablesData] = useState(() => loadKey(STORAGE_KEYS.tables, defaultTables));
  const [tableBookingsData, setTableBookingsData] = useState(() => loadKey(STORAGE_KEYS.tableBookings, defaultTableBookings));
  const [roomsData, setRoomsData] = useState(() => loadKey(STORAGE_KEYS.rooms, defaultRooms));
  const [markersData, setMarkersData] = useState(() => loadKey(STORAGE_KEYS.markers, defaultMarkers));
  const [departmentsData, setDepartmentsData] = useState(() => loadKey(STORAGE_KEYS.departments, defaultDepartments));
  const [stockMovements, setStockMovements] = useState(() => loadKey(STORAGE_KEYS.stockMovements, defaultStockMovements));

  function updateUnits(next) { setUnitsData(next); saveKey(STORAGE_KEYS.units, next); }
  function updateReservations(next) { setReservationsData(next); saveKey(STORAGE_KEYS.reservations, next); }
  function updateTasks(next) { setTasksData(next); saveKey(STORAGE_KEYS.tasks, next); }
  function updateRequests(next) { setRequestsData(next); saveKey(STORAGE_KEYS.requests, next); }
  function updateGuests(next) { setGuestsData(next); saveKey(STORAGE_KEYS.guests, next); }
  function updateUsers(next) { setUsersData(next); saveKey(STORAGE_KEYS.users, next); }
  function updateMaintenance(next) { setMaintenanceData(next); saveKey(STORAGE_KEYS.maintenance, next); }
  function updateProducts(next) { setProductsData(next); saveKey(STORAGE_KEYS.products, next); }
  function updateCash(next) { setCashData(next); saveKey(STORAGE_KEYS.cash, next); }
  function updateLog(next) { setLogData(next); saveKey(STORAGE_KEYS.log, next); }
  function updateConfig(next) { setConfig(next); saveKey(STORAGE_KEYS.config, next); }
  function updateOrders(next) { setOrdersData(next); saveKey(STORAGE_KEYS.orders, next); }
  function updateConcierge(next) { setConcierge(next); saveKey(STORAGE_KEYS.concierge, next); }
  function updateMessages(next) { setMessagesData(next); saveKey(STORAGE_KEYS.messages, next); }
  function updateTeamMessages(next) { setTeamMessagesData(next); saveKey(STORAGE_KEYS.teamMessages, next); }
  function updateTables(next) { setTablesData(next); saveKey(STORAGE_KEYS.tables, next); }
  function updateTableBookings(next) { setTableBookingsData(next); saveKey(STORAGE_KEYS.tableBookings, next); }
  function updateRooms(next) { setRoomsData(next); saveKey(STORAGE_KEYS.rooms, next); }
  function updateMarkers(next) { setMarkersData(next); saveKey(STORAGE_KEYS.markers, next); }
  function updateDepartments(next) { setDepartmentsData(next); saveKey(STORAGE_KEYS.departments, next); }
  function updateStockMovements(next) { setStockMovements(next); saveKey(STORAGE_KEYS.stockMovements, next); }

  function pushLog(action, detail, roleOverride, whoOverride) {
    const who = whoOverride || (authUser ? authUser.name : guestMode ? "Hóspede" : "Sistema");
    const role = roleOverride || (authUser ? authUser.role : guestMode ? "guest" : "");
    updateLog([{ id: `log-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, when: Date.now(), who, role, action, detail }, ...logData]);
  }

  function resolveGuest(name, list) {
    const trimmed = (name || "").trim();
    const existing = list.find((g) => g.name.toLowerCase() === trimmed.toLowerCase());
    if (existing) return { id: existing.id };
    const created = { id: `g-${Date.now()}`, name: trimmed, email: "", phone: "", nif: "", docTipo: "", docNumero: "", nacionalidade: "", dataNascimento: "", notes: "" };
    updateGuests([created, ...list]);
    return { id: created.id };
  }

  function handleToggleDeviceLock(unitId) {
    updateUnits(unitsData.map((u) => (u.id === unitId && u.device ? { ...u, device: { locked: !u.device.locked, battery: Math.max(5, u.device.battery - 1) } } : u)));
  }
  function handleBookActivity(reservation, unit, activity) {
    if (!reservation) return;
    const gName = guestName(reservation.ownerGuestId, guestsData);
    const extraId = activity.price > 0 ? `ex-${Date.now()}` : null;
    if (extraId) {
      updateReservations(reservationsData.map((r) => (r.id === reservation.id ? { ...r, extras: [...(r.extras || []), { id: extraId, productId: null, name: activity.name, price: activity.price, qty: 1, status: "pending" }] } : r)));
    }
    updateRequests([{ id: `r-${Date.now()}`, unit: unit.name, guest: gName, text: `Atividade: ${activity.name} — ${activity.time}`, time: "agora mesmo", done: false, resId: reservation.id, extraId, kind: "activity", status: "pending", guestSeen: false }, ...requestsData]);
    pushLog("Atividade pedida pelo hóspede", `${activity.name} · ${reservation.numero}`);
  }
  function handleGuestCleaningRequest(reservation, unit) {
    if (!reservation) return;
    const gName = guestName(reservation.ownerGuestId, guestsData);
    updateTasks([{ id: `t-${Date.now()}`, title: `Limpeza solicitada — ${unit.name}`, tag: "Limpeza", due: "Hoje", status: "todo", unitId: unit.id }, ...tasksData]);
    updateRequests([{ id: `r-${Date.now()}`, unit: unit.name, guest: gName, text: "Pedido de limpeza", time: "agora mesmo", done: false, resId: reservation.id, kind: "cleaning", status: "pending", guestSeen: false }, ...requestsData]);
    pushLog("Pedido de limpeza", `${unit.name} · ${reservation.numero}`);
  }
  function handleGuestMaintenanceRequest(reservation, unit, description) {
    if (!reservation) return;
    const gName = guestName(reservation.ownerGuestId, guestsData);
    const maintId = `mn-${Date.now()}`;
    updateMaintenance([{ id: maintId, unitId: unit.id, category: "Outro", title: description || "Pedido do hóspede", priority: "Média", status: "Aberto", createdAt: Date.now() }, ...maintenanceData]);
    updateRequests([{ id: `r-${Date.now()}`, unit: unit.name, guest: gName, text: `Manutenção: ${description || "sem descrição"}`, time: "agora mesmo", done: false, resId: reservation.id, kind: "maintenance", maintenanceId: maintId, status: "pending", guestSeen: false }, ...requestsData]);
    pushLog("Pedido de manutenção", `${unit.name} · ${reservation.numero}`);
  }
  function handleApproveRequest(reqId) {
    const req = requestsData.find((r) => r.id === reqId);
    if (!req) return;
    updateRequests(requestsData.map((r) => (r.id === reqId ? { ...r, done: true, status: "approved", guestSeen: false } : r)));
    if (req.extraId && req.resId) {
      updateReservations(reservationsData.map((r) => (r.id === req.resId ? { ...r, extras: (r.extras || []).map((e) => (e.id === req.extraId ? { ...e, status: "approved" } : e)) } : r)));
    }
    pushLog("Pedido aprovado", req.text);
  }
  function handleDeclineRequest(reqId) {
    const req = requestsData.find((r) => r.id === reqId);
    if (!req) return;
    updateRequests(requestsData.map((r) => (r.id === reqId ? { ...r, done: true, status: "declined", guestSeen: false } : r)));
    if (req.extraId && req.resId) {
      updateReservations(reservationsData.map((r) => (r.id === req.resId ? { ...r, extras: (r.extras || []).filter((e) => e.id !== req.extraId) } : r)));
    }
    pushLog("Pedido recusado", req.text);
  }
  function handleDismissGuestNotification(reqId) {
    updateRequests(requestsData.map((r) => (r.id === reqId ? { ...r, guestSeen: true } : r)));
  }
  function handleCheckin(reservation, staffName) {
    updateReservations(reservationsData.map((r) => (r.id === reservation.id ? { ...r, status: "checked-in", checkedInBy: staffName || null } : r)));
    pushLog("Check-in", `${reservation.numero} · ${guestName(reservation.ownerGuestId, guestsData)}${staffName ? " · " + staffName : ""}`);
  }
  function handleCheckout(reservation, staffName) {
    updateReservations(reservationsData.map((r) => (r.id === reservation.id ? { ...r, status: "checked-out", checkedOutBy: staffName || r.checkedOutBy || null } : r)));
    const unitNameStr = unitsData.find((u) => u.id === reservation.unitId)?.name || reservation.unitId;
    updateTasks([{ id: `t-${Date.now()}`, title: `Limpeza — ${unitNameStr}`, tag: "Limpeza", due: "Hoje", status: "todo", unitId: reservation.unitId }, ...tasksData]);
    updateUnits(unitsData.map((u) => (u.id === reservation.unitId && u.device ? { ...u, device: { ...u.device, locked: true } } : u)));
    pushLog("Check-out", `${reservation.numero} · ${guestName(reservation.ownerGuestId, guestsData)}${staffName ? " · " + staffName : ""}`);
  }
  function handleGuestCheckoutAuth(reservation, username, password) {
    const staffUser = usersData.find((u) => u.username === username && u.password === password && isFrontOffice(u, departmentsData));
    if (!staffUser) return { ok: false, error: "Utilizador ou password incorretos, ou sem permissão de receção." };
    handleCheckout(reservation, staffUser.name);
    return { ok: true, staffName: staffUser.name };
  }
  function handleCancelReservation(reservation) {
    const reason = window.prompt("Motivo do cancelamento (opcional):", "") || "";
    updateReservations(reservationsData.map((r) => (r.id === reservation.id ? { ...r, status: "cancelled", cancelReason: reason } : r)));
    pushLog("Reserva cancelada", `${reservation.numero} · ${guestName(reservation.ownerGuestId, guestsData)}${reason ? ` · ${reason}` : ""}`);
  }
  function handleNoShowReservation(reservation) {
    if (!window.confirm(`Marcar ${reservation.numero} como no-show?`)) return;
    updateReservations(reservationsData.map((r) => (r.id === reservation.id ? { ...r, status: "no-show" } : r)));
    pushLog("Reserva marcada como no-show", `${reservation.numero} · ${guestName(reservation.ownerGuestId, guestsData)}`);
  }
  function handleCreateReservation({ unitId, guestName: gn, additionalNames, checkin, checkout, source, value }) {
    const conflict = reservationOverlaps(unitId, checkin, checkout, reservationsData);
    if (conflict) { alert(`Conflito: esta unidade já tem a reserva ${conflict.numero} entre ${fmtShort(conflict.checkin)} e ${fmtShort(conflict.checkout)}.`); return; }
    const { id: ownerGuestId } = resolveGuest(gn, guestsData);
    const additionalGuestIds = (additionalNames || []).map((n) => resolveGuest(n, guestsData).id);
    const numero = nextNumero(reservationsData, "R");
    const newRes = { id: `res-${Date.now()}`, numero, unitId, ownerGuestId, additionalGuestIds, checkin, checkout, status: "confirmed", source, value: Number(value) || 0, extras: [], pagamentos: [], invoiceClosed: false, checkedInBy: null, checkedOutBy: null, cancelReason: null };
    updateReservations([newRes, ...reservationsData]);
    pushLog("Reserva criada", `${numero} · ${gn}${additionalGuestIds.length ? ` +${additionalGuestIds.length}` : ""} · ${checkin} a ${checkout}`);
  }
  function handleEditReservation(resId, { guestName: gn, additionalNames, checkin, checkout, source, value }) {
    const current = reservationsData.find((r) => r.id === resId);
    const conflict = reservationOverlaps(current?.unitId, checkin, checkout, reservationsData, resId);
    if (conflict) { alert(`Conflito: esta unidade já tem a reserva ${conflict.numero} entre ${fmtShort(conflict.checkin)} e ${fmtShort(conflict.checkout)}.`); return; }
    const { id: ownerGuestId } = resolveGuest(gn, guestsData);
    const additionalGuestIds = (additionalNames || []).map((n) => resolveGuest(n, guestsData).id);
    updateReservations(reservationsData.map((r) => (r.id === resId ? { ...r, ownerGuestId, additionalGuestIds, checkin, checkout, source, value: Number(value) || 0 } : r)));
    pushLog("Reserva editada", gn);
  }
  function handleAddGuestToReservation(resId, guestNameStr) {
    const r = reservationsData.find((x) => x.id === resId);
    if (!r) return;
    const unit = unitsData.find((u) => u.id === r.unitId);
    const currentCount = 1 + (r.additionalGuestIds || []).length;
    if (unit?.capacity && currentCount >= unit.capacity) { alert(`Capacidade máxima da unidade atingida (${unit.capacity}).`); return; }
    const { id: gid } = resolveGuest(guestNameStr, guestsData);
    if (gid === r.ownerGuestId || (r.additionalGuestIds || []).includes(gid)) { alert("Este hóspede já está associado a esta reserva."); return; }
    updateReservations(reservationsData.map((x) => (x.id === resId ? { ...x, additionalGuestIds: [...(x.additionalGuestIds || []), gid] } : x)));

  function handleAddExtra(resId, product) {

  function handleChangeExtraQty(resId, extraId, delta) {

  function handleCreateOrder({ tableBookingId, items }) {

      case "hospedes": return <GuestsCRM guestsData={guestsData} reservationsData={reservationsData} unitsData={unitsData} ivaRate={config.ivaPadrao} onSaveGuest={handleSaveGuest} focusGuestId={focusGuestId} onFocusHandled={() => setFocusGuestId(null)} />;
      case "unidades": return <UnitsList unitsData={unitsData} reservationsData={reservationsData} guestsData={guestsData} tasksData={tasksData} todayStr={todayStr} />;
      case "pedidos": return <RequestsPanel requestsData={requestsData} onToggle={handleToggleRequest} onApprove={handleApproveRequest} onDecline={handleDeclineRequest} />;
      case "mensagens": return <ChatSection unitsData={unitsData} reservationsData={reservationsData} guestsData={guestsData} messagesData={messagesData} todayStr={todayStr} onSend={handleSendMessage} onMarkRead={handleMarkRead} />;
      case "equipa": return <TeamChatSection teamMessagesData={teamMessagesData} authUser={authUser} onSend={handleSendTeamMessage} />;
      case "concierge": return <ConciergeSection concierge={concierge} onSave={handleSaveConcierge} />;
      case "housekeeping": return <KanbanBoard tasksData={tasksData} onAdvance={handleAdvanceTask} />;
      case "manutencao": return <MaintenancePanel unitsData={unitsData} maintenanceData={maintenanceData} onCreate={handleCreateMaintenance} onAdvance={handleAdvanceMaintenance} />;
      case "restaurante": return <RestaurantSection unitsData={unitsData} reservationsData={reservationsData} guestsData={guestsData} ordersData={ordersData} productsData={productsData} tablesData={tablesData} tableBookingsData={tableBookingsData} roomsData={roomsData} markersData={markersData} todayStr={todayStr} canEditLayout={canEditRestaurantLayout} onCreateOrder={handleCreateOrder} onCreateTableBooking={handleCreateTableBooking} onUpdateBookingStatus={handleUpdateBookingStatus} onSettleTable={handleSettleTable} onMoveTable={handleMoveTable} onMoveMarker={handleMoveMarker} onCreateTable={handleCreateTable} onUpdateTable={handleUpdateTable} onRemoveTable={handleRemoveTable} onCreateRoom={handleCreateRoom} onCreateMarker={handleCreateMarker} onRemoveMarker={handleRemoveMarker} />;
      case "cozinha": return <KitchenSection unitsData={unitsData} tableBookingsData={tableBookingsData} ordersData={ordersData} productsData={productsData} onAdvance={handleAdvanceOrder} onStartShift={handleStartKitchenShift} />;
      case "vendas": return <VendasSection unitsData={unitsData} productsData={productsData} stockMovements={stockMovements} onUpdateRate={handleUpdateRate} onAddProduct={handleAddProduct} onUpdateProduct={handleUpdateProduct} onStockMove={handleStockMove} onRemoveProduct={handleRemoveProduct} />;
      case "caixa": return <CashRegisterSection cashData={cashData} onOpen={handleOpenCash} onAddMovement={handleAddMovement} onClose={handleCloseCash} />;
      case "dispositivos": return <DevicesPanel unitsData={unitsData} onToggleDeviceLock={handleToggleDeviceLock} />;
      case "foconfig": return <FrontOfficeConfigSection config={config} onSave={handleSaveConfig} />;
      case "organizacao": return <OrganizationSection config={config} departmentsData={departmentsData} usersData={usersData} reservationsData={reservationsData} todayStr={todayStr} />;
      case "departamentos": return <DepartmentsSection departmentsData={departmentsData} usersData={usersData} onCreate={handleCreateDepartment} onUpdate={handleUpdateDepartment} onToggleModule={handleToggleDeptModule} onToggleActive={handleToggleDeptActive} />;
      case "utilizadores": return <UsersSection usersData={usersData} departmentsData={departmentsData} currentUserId={authUser?.id} onAdd={handleAddUser} onRemove={handleRemoveUser} onChangeAssignment={handleChangeUserAssignment} />;
      case "roles": return <RolesSection />;
      case "modulos": return <ModulesSection departmentsData={departmentsData} />;
      case "produtos": return <VendasSection unitsData={unitsData} productsData={productsData} stockMovements={stockMovements} onUpdateRate={handleUpdateRate} onAddProduct={handleAddProduct} onUpdateProduct={handleUpdateProduct} onStockMove={handleStockMove} onRemoveProduct={handleRemoveProduct} />;
      case "log": return <LogSection logData={logData} />;
      case "config": return <AdminConfigSection config={config} onSave={handleSaveConfig} onReset={handleReset} authUser={authUser} stats={dataStats} />;
      case "perfil": return <PreferencesPanel authUser={authUser} config={config} lang={lang} onSave={handleSavePreferences} />;
      default: return null;
    }
  }

  if (!authUser && !guestMode && !kioskFlow) {
    return <LoginScreen usersData={usersData} lang={config.defaultLanguage} onLogin={(u) => { setAuthUser(u); setSection("painel"); }} onStartKiosk={() => setKioskFlow(true)} />;
  }

  if (kioskFlow) {
    return <KioskSetupFlow usersData={usersData} unitsData={unitsData} reservationsData={reservationsData} guestsData={guestsData} departmentsData={departmentsData} todayStr={todayStr}
      onConfirmCheckin={handleKioskConfirmCheckin} onEnterExisting={handleKioskEnterExisting} onCancel={() => setKioskFlow(false)} />;
  }

  if (guestMode) {
    return (
      <div className="min-h-screen w-full py-8 px-4" style={{ backgroundColor: C.bg }}>
        <div className="flex items-center justify-center gap-2 mb-4">
          <button onClick={() => setExitAuthOpen(true)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs border" style={{ borderColor: C.line, color: C.inkSoft }}><Lock size={13} /> Recolher smartphone (receção)</button>
        </div>
        {exitAuthOpen && (
          <div className="mx-auto mb-4" style={{ maxWidth: 340 }}>
            <Card className="p-4">
              <div className="text-xs font-medium mb-2" style={{ color: C.ink }}>Confirma com os teus dados de receção para sair do modo hóspede.</div>
              <input value={exitUser} onChange={(e) => setExitUser(e.target.value)} placeholder="Utilizador" className="w-full mb-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
              <input type="password" value={exitPass} onChange={(e) => setExitPass(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") submitExitAuth(); }} placeholder="Password" className="w-full mb-2 px-3 py-2 rounded-lg border text-sm" style={inputStyle} />
              {exitError && <p className="text-xs mb-2" style={{ color: C.terracotta }}>{exitError}</p>}
              <div className="flex gap-2">
                <button onClick={submitExitAuth} className="flex-1 py-2 rounded-full text-xs font-medium text-white" style={{ backgroundColor: C.oliveDark }}>Confirmar</button>
                <button onClick={() => { setExitAuthOpen(false); setExitError(""); }} className="flex-1 py-2 rounded-full text-xs font-medium border" style={{ borderColor: C.line, color: C.inkSoft }}>Cancelar</button>
              </div>
            </Card>
          </div>
        )}
        <PhoneFrame>
          <GuestApp unit={guestUnit} reservation={guestReservation} guestsData={guestsData} concierge={concierge} ivaRate={config.ivaPadrao} config={config} messagesData={messagesData} requestsData={requestsData} ordersData={ordersData} tableBookingsData={tableBookingsData}
            onToggleDoor={() => handleToggleDeviceLock(guestUnitId)} onBookActivity={handleBookActivity} onCheckoutAuth={handleGuestCheckoutAuth} onSendMessage={handleSendMessage}
            onDismissNotification={handleDismissGuestNotification} onCleaningRequest={handleGuestCleaningRequest} onMaintenanceRequest={handleGuestMaintenanceRequest} />
        </PhoneFrame>
      </div>
    );
  }

  return (
    <AppShell authUser={authUser} departmentsData={departmentsData} section={section} setSection={setSection} onLogout={logout} lang={lang}
      badges={{ pedidos: requestsData.filter((r) => !r.done).length, mensagens: messagesData.filter((m) => m.sender === "guest" && !m.read).length }}
      searchSlot={<GlobalSearch authUser={authUser} departmentsData={departmentsData} reservationsData={reservationsData} guestsData={guestsData} unitsData={unitsData}
        onOpenReservation={(id) => { setSection("reservas"); setFocusReservationId(id); }}
        onOpenGuest={(id) => { setSection("hospedes"); setFocusGuestId(id); }}
        onGoTo={(sec) => setSection(sec)} />}>
      {renderSection()}
    </AppShell>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SlowLivingPMS />);
</script>
</body>
</html>
